[package]
name = "loams-chdb"
description = "The safe side of Loams's own FFI over libchdb: one process-global chDB engine, per-session connections, streaming results, Arrow in and out, and query cancellation (FL2 Task 1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# `build.rs` re-emits Ruling 2's rpath for this package's own targets; see the
# file for why the one in `loams-chdb-sys` cannot reach them.
build = "build.rs"
# Not published with a link against a native library this large is not the point;
# the Fabric is built from the repository (Ruling 2's container image ships
# `libchdb.so` beside the binary).
publish = false

[dependencies]
# arrow 59 with `ffi`: `Session::execute_arrow` imports chDB's Arrow C stream and
# `Session::register_arrow` exports one to it. CN1 Ruling 4 constrains the
# workspace to `arrow-array < 60`, which is why this is 59 and not the plan's
# headline 60 (FL2 Tech Stack and Task 1).
arrow.workspace = true
# `QueryStream::next_chunk` returns `Bytes`, so streaming a result does not copy
# every block out of chDB's buffer.
bytes.workspace = true
loams-chdb-sys = { path = "../loams-chdb-sys" }
# `spawn_blocking` for the async halves of the API: Task 1's Semantics paragraph
# requires every FFI call an async caller makes to run on a blocking thread.
tokio.workspace = true
# The per-statement query ids, which Task 2 echoes in `X-ClickHouse-Query-Id`
# and names in `KILL QUERY`.
uuid.workspace = true

[dev-dependencies]
# `select_one_in_every_format` decodes the Parquet bytes with a real reader
# rather than only checking that they are not empty.
parquet.workspace = true
tokio.workspace = true

[lints]
workspace = true