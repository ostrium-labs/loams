[package]
name = "loams-house-exec"
description = "Operators and functions of the Loams House Rust engine: ClickHouse scalar functions, aggregates and combinators, and the FINAL, totals, LIMIT BY, ARRAY JOIN and fill operators, on DataFusion (design §75 §6.3, plan HE1 Tasks 27-35)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
loams-house-types = { path = "../loams-house-types" }
# Aggregate names: combinators and parameters (plan HE1 Task 28).
loams-house-sql = { path = "../loams-house-sql" }
# UDF, UDAF and UDWF traits and the physical-plan operators. Apache-2.0.
datafusion.workspace = true

[dev-dependencies]
# The partial-state test runs plans; fixtures are JSON. MIT, MIT OR Apache-2.0.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true

[lints]
workspace = true
