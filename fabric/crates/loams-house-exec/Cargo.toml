[package]
name = "loams-house-exec"
description = "Operators and functions of the Loams House Rust engine: ClickHouse scalar functions, aggregates and combinators, and the FINAL, totals, LIMIT BY, ARRAY JOIN and fill operators, on DataFusion (design §75 §6.3, plan HE1 Tasks 27-35)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
loams-house-types = { path = "../loams-house-types" }
# UDF, UDAF and UDWF traits and the physical-plan operators. Apache-2.0.
datafusion.workspace = true
# The function registry the engine plans against (`Registry`) and the
# functions' internal names. Apache-2.0.
loams-house-sql = { path = "../loams-house-sql" }
# Regular expressions for `match`, `replaceRegexp*` and `like` (RE2 patterns,
# translated; R31.3). MIT OR Apache-2.0.
regex = "1.12"
# xxHash32 and xxHash64. MIT.
twox-hash = { version = "2.1", default-features = false, features = ["xxhash32", "xxhash64"] }
# SipHash-2-4 for sipHash64. MIT OR Apache-2.0.
siphasher = "1.0"
# generateUUIDv4. MIT OR Apache-2.0.
uuid = { workspace = true }

[lints]
workspace = true
