[package]
name = "loams-house"
description = "Loams's ClickHouse HTTP surface over the Fabric's Fluss tables: errors rendered as ClickHouse renders them, code for code (FL2 Task 3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Not published: the crate links the digest-pinned `libchdb.so` through
# `loams-chdb-sys` (FL2 Ruling 2), so the Fabric is built from the repository.
publish = false

[dependencies]
# The House's engine. Task 3 raises errors *through* chDB's own exception text
# (`ChdbError`), so the code, name and message of a failed statement are that
# crate's parse of the pinned library's `Code: … DB::Exception: … (NAME)` string
# and are never re-derived here.
loams-chdb = { path = "../loams-chdb" }
# The `links = "chdb"` package, for one reason: its build script publishes the
# directory it resolved `libchdb.so` into as `DEP_CHDB_LIB_DIR`, and this package's
# own `build.rs` needs it to re-emit Ruling 2's rpath for this package's test
# binaries. No Rust code here uses it, and that is deliberate: `cargo:rustc-link-arg`
# is per-package, so the only way a House test binary finds `libchdb.so` is to read
# the metadata the `-sys` package publishes. The dependency is on the `-sys` crate
# rather than on `loams-chdb` because only an immediate dependent of a `links`
# package is handed its metadata.
loams-chdb-sys = { path = "../loams-chdb-sys" }
# `HouseError`'s `Display`/`Error`, which the HTTP layer (Task 2) surfaces to the
# per-request error handler. Apache-2.0 OR MIT.
thiserror.workspace = true

[lints]
workspace = true