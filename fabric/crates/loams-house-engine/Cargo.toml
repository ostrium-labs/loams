[package]
name = "loams-house-engine"
description = "The Loams House Rust engine: a session that plans and executes ClickHouse statements over pinned lake tables and writes ClickHouse formats, the worker binary the House front runs it in, and a loopback dev server for the oracle (design §75 §8, plan HE1 Tasks 23, 39)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
loams-house-types = { path = "../loams-house-types" }
loams-house-sql = { path = "../loams-house-sql" }
loams-house-exec = { path = "../loams-house-exec" }
loams-house-iceberg = { path = "../loams-house-iceberg" }
loams-house-formats = { path = "../loams-house-formats" }
# The front's setting lists and chDB's defaults (plan HE1 Task 37, D1805): the
# shared contract, never the front itself (`engine_crates_stay_apart`).
loams-house-ipc = { path = "../loams-house-ipc" }
datafusion.workspace = true
# The dev server's runtime for DataFusion's async execution. MIT.
# `time` holds a statement to `max_execution_time` (Task 37).
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
# Seeding: the columns' types in `X-Loams-Columns`; Parquet bodies. MIT OR Apache-2.0, MIT.
serde_json.workspace = true
bytes.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# `tests/lake.rs` (plan HE1 Task 26) writes the corpus's lake fixtures with the
# House's own writer: dev-dependencies only (`engine_crates_stay_apart` reads
# normal dependencies).
loams-house-lake = { path = "../loams-house-lake" }
arrow-ipc.workspace = true

[[bin]]
name = "loams-house-engine-dev"
path = "src/bin/loams-house-engine-dev.rs"

[lints]
workspace = true
