[package]
name = "loams-house-engine"
description = "The Loams House Rust engine: a session that plans and executes ClickHouse statements over pinned lake tables and writes ClickHouse formats, the worker binary the House front runs it in, and a loopback dev server for the oracle (design §75 §8, plan HE1 Tasks 23, 39)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
loams-house-types = { path = "../loams-house-types" }
loams-house-sql = { path = "../loams-house-sql" }
loams-house-exec = { path = "../loams-house-exec" }
loams-house-iceberg = { path = "../loams-house-iceberg" }
loams-house-formats = { path = "../loams-house-formats" }
datafusion.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
parquet = { workspace = true, features = ["arrow"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "io-util", "signal"] }
clap.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
url = "2"

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
