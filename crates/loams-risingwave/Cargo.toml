[package]
name = "loams-risingwave"
description = "Managed RisingWave on Loams: the cluster model, the config renderer (meta on Loams Postgres, Hummock on Loams object storage), the stateless lifecycle adapter, health probes and the gateway route (design 81, plan RW1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
# `loams risingwave …` (RW-b): the subcommand's args; `env` for LOAMS_RISINGWAVE_URL.
clap = { workspace = true, features = ["env"] }
futures.workspace = true
# The shared managed-engines trait and model (ENG-UI, design 81 D2010).
loams-engines.workspace = true
# Purging an instance's state prefix on delete.
object_store.workspace = true
rand.workspace = true
# The meta dashboard's JSON API (probes); plain HTTP inside the tenant network.
reqwest.workspace = true
# TLS to a remote engine-gateway (RW-b): the workspace's rustls with ring,
# over tokio-rustls, with the Mozilla roots; all already in the lockfile.
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The frontend's PG wire (probes and the bootstrap of the service users).
tokio-postgres = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Metering windows (loams-engines' usage()).
time.workspace = true
# risingwave.toml, the gateway's routes entries and RW-b's pipeline specs.
toml.workspace = true
tracing.workspace = true
webpki-roots = "1"

[dev-dependencies]
# examples/engines_facade_bench.rs (BQ1-stream).
axum.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
