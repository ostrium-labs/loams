[package]
name = "loams-meter"
description = "Loams Meter's `meter` role (design §63 §5.2): counter owners, reconciliation, the lease service, the entitlement, customer and plan services, the notifier and the OpenMeter-compatible API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Webhook secrets sealed at rest, as pg-control seals role passwords (D2205).
age.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
buffa.workspace = true
connectrpc = { workspace = true, features = ["server"] }
hmac.workspace = true
loams-cloudevents = { path = "../loams-cloudevents", version = "0.1.4", default-features = false }
loams-authz.workspace = true
loams-common.workspace = true
# Cost attribution (design §84, CA1 Task 6).
loams-cost = { path = "../loams-cost", version = "0.1.4" }
loams-meter-core = { path = "../loams-meter-core", version = "0.1.4" }
# QueryMeter runs the House query of `loams-meter-house` (ME1 Task 8).
loams-meter-house = { path = "../loams-meter-house", version = "0.1.4" }
# ME-gate's policy table (the lease's fail-open budget) and its LeaseSource,
# which `lease_client` implements.
loams-meter-gate = { path = "../loams-meter-gate", version = "0.1.4" }
# ME-export's exporters, each behind an `export-*` feature (D2210, D2207).
loams-meter-export = { path = "../loams-meter-export", version = "0.1.4", optional = true }
loams-proto.workspace = true
# Webhook deliveries; the process installs rustls's crypto provider.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
ulid.workspace = true

[features]
# ME-export's exporters (design §63 §16): the ledger and cursors in the role's
# control store, and the schedule that runs them.
export-stripe = ["dep:loams-meter-export", "loams-meter-export/stripe"]
export-openmeter = ["dep:loams-meter-export", "loams-meter-export/openmeter"]
export-lago = ["dep:loams-meter-export", "loams-meter-export/lago"]
export-webhook = ["dep:loams-meter-export", "loams-meter-export/webhook"]

[dev-dependencies]
jsonschema.workspace = true
proptest.workspace = true
# The mailer's and exporters' tests build reqwest clients: ring, as the loams binary installs.
rustls = { workspace = true, features = ["ring", "std"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
