[package]
name = "loams-meter"
description = "Loams Meter's `meter` role (design §63 §5.2): counter owners, reconciliation, the lease service, the entitlement, customer and plan services, the notifier and the OpenMeter-compatible API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Webhook secrets sealed at rest, as pg-control seals role passwords (D2205).
age.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
buffa.workspace = true
connectrpc = { workspace = true, features = ["server"] }
hmac.workspace = true
loams-cloudevents = { path = "../loams-cloudevents", version = "0.1.2", default-features = false }
loams-authz.workspace = true
loams-common.workspace = true
loams-meter-core = { path = "../loams-meter-core", version = "0.1.2" }
# QueryMeter runs the House query of `loams-meter-house` (ME1 Task 8).
loams-meter-house = { path = "../loams-meter-house", version = "0.1.2" }
loams-proto.workspace = true
# Webhook deliveries; the process installs rustls's crypto provider.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
ulid.workspace = true

[dev-dependencies]
jsonschema.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
