[package]
name = "loams-wal-decoder"
description = "loams-wal with the in-process interpreted sender: the Neon fork's wal_decoder behind loams-safekeeper's WalInterpreter (PG2 Task 31, Q112)."
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["The Loams Authors"]
publish = false

# A workspace of its own (PG2 ruling R31.3, owner ruling 2026-10-08): the
# fork's crates bring Neon's dependency tree and git sources, which stay out
# of the main workspace's Cargo.lock and licence check. The main workspace
# lists this directory in `exclude`.
#
# Building needs POSTGRES_INSTALL_DIR with v14..v17/include/postgresql/server
# (scripts/pg2/pg-headers.sh, from the pinned `neon` image).
[workspace]
members = ["."]

[lib]
path = "src/lib.rs"

# Not `loams-wal`: where both workspaces share one target dir (a configured
# target-dir, as on the build machine), a binary of the same name would
# overwrite the main workspace's loams-wal. scripts/loams-pg-bench/run.sh
# runs this one (LOAMS_WAL, else this workspace's target dir).
[[bin]]
name = "loams-wal-interpreted"
path = "src/bin/loams-wal-interpreted.rs"

[features]
# loams-wal's stores, passed through to loams-safekeeper.
tikv = ["loams-safekeeper/tikv"]
nvme = ["loams-safekeeper/nvme"]
compio = ["loams-safekeeper/compio"]

[dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.92"
bytes = "=1.12.1"
loams-safekeeper = { path = "../loams-safekeeper", features = ["server"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
# Neon's official repository at fa504217 (2026-08-31), its last public commit
# and the base of the former ostrium-labs/loams-postgres fork (D2450: no
# forks). Lost with the fork's decoder trim (loams-decoder-trim-3): consumers
# can no longer leave out the storage clients (aws-sdk, azure), pprof, the
# tarball helpers, utils' auth and connection string, the OpenTelemetry
# conversions and rust-postgres, so this workspace links Neon's whole
# dependency tree again (about 700 crates instead of 420) and its deny.toml
# carries the advisories that tree brings.
pageserver_api = { git = "https://github.com/neondatabase/neon", rev = "fa504217c61bbcaf5c512d75830564541f917f8f", default-features = false }
postgres_ffi = { git = "https://github.com/neondatabase/neon", rev = "fa504217c61bbcaf5c512d75830564541f917f8f" }
utils = { git = "https://github.com/neondatabase/neon", rev = "fa504217c61bbcaf5c512d75830564541f917f8f", default-features = false, features = ["rename_noreplace"] }
wal_decoder = { git = "https://github.com/neondatabase/neon", rev = "fa504217c61bbcaf5c512d75830564541f917f8f" }

[dev-dependencies]
serde_json = "=1.0.151"
sha2 = "=0.10.8"
# Neon's zstd (see Cargo.lock), for the compressed WAL fixture.
zstd = "=0.13.0"

# Neon's `workspace_hack` (cargo-hakari) unifies features across Neon's whole
# workspace; an empty stand-in keeps that tree out of this build.
[patch."https://github.com/neondatabase/neon"]
workspace_hack = { path = "workspace-hack-stub" }

# Neon's own rust-postgres and azure-sdk-for-rust forks come in through
# neon's workspace (branch `neon`, locked by commit in Cargo.lock); deny.toml
# allows those neondatabase repositories.
