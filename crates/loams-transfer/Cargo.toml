[package]
name = "loams-transfer"
description = "Resumable chunked transfers and job-run streams (design 85, plan DQ1): a fenced journal over the metastore and the bucket, the HTTP API, and the desktop sidecar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "loams-transfer"
path = "src/bin/loams-transfer.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
glob = "0.3"
# HTTP/3 at CT1 Task 0's pins (D2305, D2435).
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
hex.workspace = true
http.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
loams-common.workspace = true
loams-meta.workspace = true
loams-store.workspace = true
object_store.workspace = true
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1.15", features = ["std"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging"] }
tokio-stream.workspace = true
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
