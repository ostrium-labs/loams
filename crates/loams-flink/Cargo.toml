[package]
name = "loams-flink"
description = "Managed Flink SQL for Loams (design 81, plan FL1): SQL Gateway and JobManager REST clients, per-tenant session clusters, config rendering and the gateway module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = ["kubernetes"]
# The Kubernetes runtime of the session-cluster controller (runtime_kube).
kubernetes = ["dep:kube", "dep:k8s-openapi"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
hex.workspace = true
http.workspace = true
k8s-openapi = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
loams-store.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util = "0.1"
httpmock.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
