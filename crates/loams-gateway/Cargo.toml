[package]
name = "loams-gateway"
description = "loams-gateway: one Rust gateway with a module per protocol, Postgres first. Routes `<ns>.<region>.pg.<base-domain>` to the namespace's PgDog (design §57; plan GW1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "loams-gateway"
path = "src/main.rs"

[features]
default = []
# The Temporal API module (design 74 §5.7, D1504; plan DX1 Task 9): its
# own listener and Deployment, the same frontend as `loams-temporal`.
temporal = ["dep:loams-temporal-frontend"]
# The Redis module (design 77 §10, D1646; plan KV2 Task 2): its own
# listener and Deployment, on the embedded or in-memory store.
resp = ["dep:loams-resp"]
# The Redis module on TiKV too (the `tikv` profile).
resp-tikv = ["resp", "loams-resp/tikv"]

[dependencies]
clap.workspace = true
loams-temporal-frontend = { path = "../loams-temporal-frontend", optional = true }
loams-resp = { path = "../loams-resp", optional = true }
hex.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# TCP keepalive on long-lived relays (already in the lockfile through tokio).
socket2 = "0.6"
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile.workspace = true

[lints]
workspace = true
