[package]
name = "loams-pg-control"
description = "Loams Postgres's control plane (design §46 §6): the records and the PgControlStore, over loams-kv's embedded (redb) store in single-node mode and TiKV in production."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Reached only through `loams`'s feature `postgres` (PG2 Task 9); its tikv
# backend depends on loams-tikv, which is publish = false.
publish = false

[features]
# The TiKV backend (store::tikv), wrapping loams-tikv through loams-kv.
tikv = ["loams-kv/tikv"]
# KvControlStore::with_faults: loams-kv's fault hooks, for the conformance
# suite's injected faults.
faults = ["loams-kv/faults"]
# secrets::KubeSecretStore: role secrets as Kubernetes Secrets (Task 6).
kubernetes = ["dep:kube", "dep:k8s-openapi"]
# secrets::KeySource::Keyring: the file store's key in the OS keyring.
keyring = ["dep:keyring"]

[dependencies]
# The single-node secret file (secrets::FileSecretStore).
age.workspace = true
async-trait.workspace = true
# The upcall listener (src/upcall.rs, Task 8): routes on axum, connections
# served by hyper with a header read timeout.
axum.workspace = true
base64.workspace = true
futures.workspace = true
hex.workspace = true
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken.workspace = true
k8s-openapi = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
# --pg-authz openfga: model v1's checks (design 76 §9, IA2).
loams-authz.workspace = true
# The format registry (UP1 Task 1).
loams-common.workspace = true
loams-kv.workspace = true
# Usage events and the entitlement gate (design §63; ME1 Tasks 3, 21).
loams-meter-gate.workspace = true
# The clients NeonClients adapts (src/neon.rs); loams-postgres never
# depends on this crate.
loams-postgres.workspace = true
postcard.workspace = true
# Role passwords: 32 bytes from the OS (secrets::generate_password).
rand.workspace = true
# The computes' local CA and their certificates (src/runtime/certs.rs, Task
# 10): ECDSA P-256 on ring, as loams-sqlgate uses it (0.14.10, already in the
# lockfile).
# The compute runner's client (src/runtime/remote.rs, R-REL.1); already a
# dependency through loams-postgres.
reqwest.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Checking that the stored compute CA's certificate is its key's (certs.rs).
# 0.18.1 is already in the lockfile (through rcgen).
x509-parser = "0.18"
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The storage controller's token, compared in constant time.
subtle = "2.6"
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
# PgDog's admin database (src/pgdog/admin.rs, Task 21), and SELECT 1 in the
# compose tests.
tokio-postgres = "0.7"
# The config push to pgdog-config-sync over mutual TLS (src/pgdog/push.rs,
# Task 21); both already in the lockfile through loams-sqlgate.
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The sidecar's file format and atomic writes, for compose's bind mount.
loams-pgdog-sync = { path = "../loams-pgdog-sync" }
http-body-util = "0.1"
bytes.workspace = true
# The compute images' pin file, deploy/pins/loams-postgres-images.toml
# (runtime::images, Task 11); already in the lockfile.
toml.workspace = true
# Calling the upcall router per connection (tower::Service).
tower.workspace = true
tracing.workspace = true
ulid.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The conformance suite injects faults (feature `faults`).
loams-pg-control = { path = ".", features = ["faults"] }
proptest.workspace = true
tempfile.workspace = true
# role_secret_never_logged captures every log line.
tracing-subscriber.workspace = true
# The compute certificates' checks (runtime::certs): the chain and the
# fields. 0.18.1 is already in the lockfile (through rcgen).
x509-parser = { version = "0.18", features = ["verify"] }

[[test]]
name = "store_tikv"
required-features = ["tikv"]

[[test]]
name = "service_tikv"
required-features = ["tikv"]

[[test]]
name = "reconcile_tikv"
required-features = ["tikv"]

[[test]]
name = "endpoints_tikv"
required-features = ["tikv"]

[[test]]
name = "secrets_kube"
required-features = ["kubernetes"]

[[test]]
name = "runtime_kube"
required-features = ["kubernetes"]

[[test]]
name = "it_kind"
required-features = ["kubernetes"]

[lints]
workspace = true
