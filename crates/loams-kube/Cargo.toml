[package]
name = "loams-kube"
description = "Shared controller runtime of the Loams operator and control planes: leader election with self-fence (design 86, plan OP2-A). Preview."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
k8s-openapi.workspace = true
kube = { workspace = true, features = ["client"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync", "macros", "rt"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# `test-util`: paused time (`start_paused = true`) drives the lease tests.
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true
