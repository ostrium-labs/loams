[package]
name = "loams-durable"
description = "Durable execution for Loams: the Resonate server embedded in process (D1, design §21)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# The Resonate crates are git dependencies (D140), which crates.io refuses.
publish = false

[features]
default = []
# The TiDB backend through Resonate's MySQL plugin (loams's durable-mysql).
mysql = ["dep:resonate-server-mysql", "dep:rustls", "dep:sqlx"]
# The Postgres backend through Resonate's Postgres plugin (loams's
# durable-postgres).
postgres = ["dep:resonate-server-postgres"]
# Push delivery to http(s):// targets (loams's durable-push). Off by default:
# upstream's push transport links google-cloud-auth unconditionally (D2450).
# (OpenSSL comes in either way: resonate-auth, under the HTTP gateway, uses
# reqwest 0.12 with its default native-tls; release builds link it statically.)
push = ["dep:resonate-transport-http-push"]

[dependencies]
async-trait.workspace = true
# The local store (`server_local`): upstream's blob server on a redb file, the
# default for `loams dev` and `standalone` (D2450: resonate-server-sqlite cannot
# be linked beside Loams's SQLite).
redb.workspace = true
resonate-base.workspace = true
resonate-core.workspace = true
resonate-gateway-http.workspace = true
resonate-plugin.workspace = true
# Loams's own durable functions run on the Rust SDK over the in-process
# network (D141).
resonate-sdk.workspace = true
resonate-server-blob.workspace = true
resonate-server-mysql = { workspace = true, optional = true }
resonate-server-postgres = { workspace = true, optional = true }
resonate-transport-http-poll.workspace = true
resonate-transport-http-push = { workspace = true, optional = true }
rustls = { workspace = true, optional = true, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true, features = ["mysql", "runtime-tokio", "tls-rustls"] }
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
sqlx = { workspace = true, features = ["mysql", "runtime-tokio", "tls-rustls"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
