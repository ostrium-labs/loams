[package]
name = "loams-web-bridge"
description = "The web toolbox's browser providers: one Obscura CDP driver, launched locally or reached as the deployment's browser service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Not in the release workflow's declared crate list yet: publishing is an owner
# decision under issue #254, and this crate is consumed as a path or git
# dependency until then (AP1b's repository will take it the same way).
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
# The local engine's per-launch CDP token (32 random bytes).
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
# The engine's CDP endpoint is a WebSocket: plain ws:// on loopback or the
# private network, wss:// when a deployment puts TLS in front of the browser
# service. rustls with webpki roots. Kept out of [workspace.dependencies] so
# Cargo does not union these features into loams-sidebar-browser, which is
# loopback-only and deliberately TLS-free. MIT/Apache-2.0 (cargo deny).
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
loams-web-bridge = { path = ".", features = ["test-util"] }
tempfile.workspace = true

[features]
# The deterministic drivers the conformance suite runs against. Not in a
# production build.
test-util = []

[lints]
workspace = true
