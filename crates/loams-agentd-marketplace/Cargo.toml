[package]
name = "loams-agentd-marketplace"
description = "The Loams Marketplace in agentd: listings, sources, signed index verification, install plans and installers (design 73, plan MK1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["agentd"]
# agentd's half: the marketplace service and its installers, the engine
# probe, installed agents' identities, consent plans, provenance checks, the
# conformance runner and Walrus artifact reads. Without it the crate is the
# listing core (schemas v1 and v2, the index, sources, revocations and
# signature verification), which the operator and one-click deploy build on
# (OP2-B Task 1, D2605).
agentd = [
    "fetch",
    "dep:loams-agentd-harness",
    "dep:loams-walrus",
    "dep:loams-zitadel",
    "dep:rustix",
    "dep:time",
    "dep:tokio",
    "dep:tracing",
]
# The `Fetcher` trait and its HTTPS client.
fetch = ["dep:async-trait", "dep:reqwest"]
# A signed fake world for tests (`testkit`); its agentd half needs `agentd`.
testkit = []

[dependencies]
# The listing core.
# Cosign key bundles: base64 signatures and PEM keys (OP2-B Task 3).
base64.workspace = true
hex.workspace = true
jsonschema.workspace = true
# `KeyVerifier`: ECDSA P-256 over a cosign `sign-blob --key` bundle (D2609).
ring.workspace = true
semver = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sigstore-verify.workspace = true
thiserror.workspace = true

# `fetch`: the HTTPS fetcher (reqwest 0.12 on rustls, as the other agentd
# crates fetch).
async-trait = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy"], optional = true }

# `agentd`.
# Walrus artifact locations (MS1 Task 5, D1812): verified, hedged reads.
loams-walrus = { path = "../loams-walrus", optional = true }
# The refresh timer and the registration watch, and logs.
tracing = { workspace = true, optional = true }
# An installed agent's identity (IA4 Task 3, D1618, D1629): its Zitadel machine key's RFC 7523
# assertion, and the assertion's clock.
loams-zitadel = { workspace = true, optional = true }
time = { workspace = true, optional = true }
# The conformance runner (MK1 Task 8): agentd's ACP JSON-RPC client, and the
# agent process, its loopback world and the signals that stop it. The
# workspace tokio has "full", which covers both.
loams-agentd-harness = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time", "rt"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"], optional = true }

[dev-dependencies]
# The mock Walrus aggregator and HTTPS registry of tests/walrus.rs.
axum.workspace = true
loams-agentd-marketplace = { path = ".", features = ["testkit"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
# The fetcher's tests: a TLS server with a self-signed certificate, as
# loams-agentd-connect's remote tests make one.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
