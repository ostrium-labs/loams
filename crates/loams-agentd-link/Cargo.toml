[package]
name = "loams-desktop-link"
description = "Loams integration for the desktop fork: Connect-RPC client for a local loams server (with a mock mode), Authentik OIDC sign-in, and the Loams Bot A2A client and ACP shim. No GPUI dependency, so it builds and tests fast."
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true

[dependencies]
loams-desktop-brand.workspace = true
# Generated by buf (buf.gen.yaml); the connect tree needs the `client` feature,
# the in-process mock needs `server`.
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc = { version = "0.9.1", features = ["client", "server"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
url = { version = "2", features = ["serde"] }
http = "1"
sha2.workspace = true
base64 = "0.22"
getrandom = "0.3"
webbrowser = "1"
keyring = "4.2"
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
