[package]
name = "loams-agentd-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
loams-agentd-doc.workspace = true
loro.workspace = true
loro-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["serde"] }

# NWPathMonitor bridge (net_path.rs) — the update handler is an ObjC block.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"

[features]
# In-process registry server speaking the DO's JSON WS protocol — test
# infrastructure for this crate's tests and loams-agentd-sessions's integration tests.
mock-server = []

[dev-dependencies]
chrono.workspace = true
# chat2_live example only (live checkpoint fetch against a deployed worker).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
loams-agentd-proto.workspace = true
tempfile.workspace = true
# `start_paused` virtual-clock tests (the 2026-07-30 sync-stall regressions).
tokio = { workspace = true, features = ["test-util"] }

# The workspace policy, except `unsafe_code` is `deny` rather than `forbid`: this crate
# has audited FFI and process sites, each under `#[allow(unsafe_code)]` with a SAFETY
# comment (plan DD1 ruling T1-13). Cargo cannot combine `workspace = true` with an
# override, so the rest of `[workspace.lints]` is repeated here; keep them in step.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
