[package]
name = "loams-meter-agent"
description = "The Loams Meter node agent (design §63 §21, from platform design 01): cgroup v2 meters, tenant resolution, a durable spool and the _system/_meter stream sink."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "loams-meter-agent"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["env"] }
reqwest.workspace = true
# The host report's MAC (platform doc 06 PD64), epochs and keys.
hmac.workspace = true
# The usage profile's CloudEvents, D270's record layout and the stream's
# default partitioner (design §63 §6, §21).
loams-cloudevents.workspace = true
loams-log.workspace = true
# loams.meter.v1.host, derived by hand (no protoc at build time).
prost.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# RFC 3339 windows in the CloudEvents envelope (PD2).
time = { workspace = true, features = ["serde"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
httpmock.workspace = true
tempfile.workspace = true

[lints]
workspace = true
