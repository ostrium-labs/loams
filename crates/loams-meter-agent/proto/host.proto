// loams.meter.v1.host: the host report on the node-local socket
// (design 63 §21; platform doc 06 §3.1, §3.3). The Rust types are written by
// hand with prost's derive in src/host/proto.rs and must match this file.
// Each frame is one message, length-delimited (a varint length, then the
// message).
syntax = "proto3";

package loams.meter.v1.host;

message Invocation {
  string org = 1;
  string namespace = 2;
  string function = 3;
  string version = 4;
  string invocation_id = 5;   // generated by the host, never by the tenant
  uint64 cpu_usec = 6;
  uint64 fuel = 7;
  uint64 epochs = 8;
  int64 start_unix_ms = 9;
  int64 end_unix_ms = 10;
  bool cpu_estimated = 11;
  string runner = 12;
}

message HostReport {
  string host_id = 1;
  uint64 seq = 2;                       // from 1, monotonic per host_id
  repeated Invocation invocations = 3;
  bytes epoch = 4;                      // 16 bytes, issued by the agent
  bytes mac = 5;                        // HMAC-SHA-256, see src/host/auth.rs
}

message Gap {
  string host_id = 1;
  uint64 from_seq = 2;
  uint64 to_seq = 3;
  string reason = 4;                    // buffer_full, spool_full, spool_lost
  bytes epoch = 5;
  bytes mac = 6;
}

message SandboxFinished { string cgroup = 1; }

message Hello {
  string host_id = 1;
  bytes epoch = 2;
  uint64 acked_seq = 3;
}

message Welcome {
  bytes epoch = 1;
  bytes key = 2;
  uint64 acked_seq = 3;
}

message HostReportAck { uint64 seq = 1; }   // cumulative
message SandboxReadAck { string cgroup = 1; }
message Reject { string reason = 1; }

message HostMessage {
  oneof msg {
    Hello hello = 1;
    HostReport report = 2;
    Gap gap = 3;
    SandboxFinished sandbox_finished = 4;
  }
}

message AgentMessage {
  oneof msg {
    Welcome welcome = 1;
    HostReportAck ack = 2;
    SandboxReadAck sandbox_read = 3;
    Reject reject = 4;
  }
}
