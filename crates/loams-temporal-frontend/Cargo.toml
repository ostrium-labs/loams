[package]
name = "loams-temporal-frontend"
description = "The Temporal gateway's WorkflowService frontend: the DX1 method set over the pure state machine, the compare-and-set store, matching and Resonate (design 74 §5, plan DX1 Task 8)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
clap.workspace = true
async-trait.workspace = true
bytes.workspace = true
hex.workspace = true
hmac.workspace = true
http.workspace = true
loams-temporal-history = { path = "../loams-temporal-history" }
loams-temporal-matching = { path = "../loams-temporal-matching" }
loams-temporal-proto = { path = "../loams-temporal-proto" }
loams-temporal-resonate = { path = "../loams-temporal-resonate" }
loams-temporal-schedule = { path = "../loams-temporal-schedule" }
loams-temporal-statemachine = { path = "../loams-temporal-statemachine" }
loams-temporal-store = { path = "../loams-temporal-store" }
loams-temporal-visibility = { path = "../loams-temporal-visibility" }
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net", "signal"] }
tokio-stream = { workspace = true, features = ["net"] }
toml.workspace = true
# The Go SDK compresses its requests with gzip.
tonic = { workspace = true, features = ["gzip"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
http.workspace = true
tonic-prost.workspace = true
loams-temporal-testkit = { path = "../loams-temporal-testkit" }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net"] }
tokio-stream = { workspace = true, features = ["net"] }

[[bin]]
name = "loams-temporal"
path = "src/bin/loams-temporal.rs"

[lints]
workspace = true
