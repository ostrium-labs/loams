[package]
name = "loams-knowledge"
description = "The read-only project knowledge cache (MS1 Task 7, D1813): a public repository's knowledge set at one commit as one Walrus quilt, a Sigstore-signed manifest in the bucket, and verified reads for agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
bytes.workspace = true
# `loams knowledge publish` and `verify` (MS1 Task 9), dispatched by the
# `loams` binary.
clap.workspace = true
futures.workspace = true
hex.workspace = true
# The manifest's signature is a Sigstore bundle, verified as the marketplace
# index is (MK1 Task 0 rulings 3-4; ruling 1 of MS1 Task 7).
loams-agentd-marketplace.workspace = true
# The bucket: the manifest and its bundle live here (D1).
loams-store.workspace = true
loams-walrus.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "process", "rt", "sync"] }
toml.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# The mock aggregator and publisher of the tests.
axum.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
