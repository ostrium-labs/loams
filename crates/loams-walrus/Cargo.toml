[package]
name = "loams-walrus"
description = "The Walrus fast path (MS1 Task 4, D1811): SHA-256-verified, hedged HTTP reads from Walrus aggregators, publisher writes read back before they count, and a verified disk cache. A public tier, never a Store backend; off by default."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# HTTP only to aggregators and publishers: no Sui SDK and no walrus-* crates
# (D1811).
[dependencies]
# Blob ids are 32 bytes in URL-safe base64 without padding.
base64.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
# `rustls-no-provider`: https uses the process's rustls provider; the clients
# install ring's when none is installed, as loams-temporal-resonate does.
reqwest = { workspace = true, features = ["rustls-no-provider", "stream"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Streamed reads land in a temp file beside the destination, renamed once
# verified; a losing hedge's file is deleted when it is dropped.
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
# The mock aggregators and publisher of the tests.
axum.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
