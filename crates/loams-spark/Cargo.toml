[package]
name = "loams-spark"
description = "Managed Spark through Spark Connect (design 81, plan SP1): the Spark Connect proxy (auth, tenant routing, session limits), the Sail and Apache Spark 4 backends, cluster config rendering and the ManagedEngine adapter. Spark Connect protos vendored from apache/spark v4.1.3."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The generated code is built from Apache-2.0 protos (LICENSE-apache-spark);
# the crate's own code is Apache-2.0 too.
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "loams-spark-proxy"
path = "src/bin/loams-spark-proxy.rs"

[dependencies]
async-trait.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["env"] }
futures.workspace = true
hex.workspace = true
http.workspace = true
loams-authz = { path = "../loams-authz" }
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
tonic-prost-build.workspace = true

[lints]
workspace = true
