[package]
name = "loams-temporal-resonate"
description = "The Temporal gateway's Durability port onto Resonate: deterministic promise IDs, an in-process fake, the interim HTTP adapter and the outbox relay (DX1 Task 6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# No Loams-internal dependencies (D1539), no Temporal protos, and no Resonate
# crates: the interim adapter speaks the wire protocol itself until FW3's
# `resonate-client` replaces it (D1591).
[dependencies]
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
hex.workspace = true
percent-encoding.workspace = true
# `rustls-no-provider`: https uses the process's rustls provider; `new`
# installs ring's when none is installed, as loams-durable's MySQL path does.
reqwest = { workspace = true, features = ["rustls-no-provider", "stream"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
