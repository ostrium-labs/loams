[package]
name = "loams-meter-gate"
description = "What products link to meter and enforce usage (design §63 §5.2): the usage event, MeterSink (best-effort and spooled), observer adapters, the Gate and NoGate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# The dependency runs one way (D202, D551): products depend on this crate,
# never the reverse, and it depends on no product. It must also build from the
# `fabric/` workspace by path (ME1 global constraints), so it keeps to std and
# serde_json: no async runtime, no Arrow, no loams-log.
[dependencies]
# Not `workspace = true`: the root's `preserve_order` feature would unify into
# fabric's serde_json and change the House's JSON key order. Event encoding is
# deterministic either way.
serde_json = "1"

# ME1 Task 18's latency gate (std-only, D2183): run with `cargo bench`.
[[bench]]
name = "gate_check_p99_under_5us"
harness = false

[lints]
workspace = true
