[package]
name = "loams-temporal-schedule"
description = "Temporal Schedules for the Loams Temporal gateway: calendar, cron and interval specs with jitter, overlap policies and catch-up windows, and the schedule store (design 74, D2070-D2073)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
loams-temporal-proto = { path = "../loams-temporal-proto" }
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Runtime queries only, as loams-temporal-store: a build needs no database.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "json"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
