[package]
name = "loams-transport"
description = "Loams' cluster transport (design 83, plan CT1): SPIFFE-style workload identities, mTLS configuration for HTTP/2 and HTTP/3, and peer identity extraction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# TLS 1.3 only, on aws-lc-rs (D2306; CT1 R0.4).
rustls = { workspace = true, features = ["aws_lc_rs", "std", "logging"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
thiserror.workspace = true
x509-parser = "0.18"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }

[lints]
workspace = true
