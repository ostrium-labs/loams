[package]
name = "loams-ca"
description = "The deployment's internal CA (design 83 §6, plan CT1 Task 3): its state document with the intermediate key sealed by age, join tokens, the deny list, intermediate rotation, and the `loams.ca.internal.v1.CertificateService` Connect service that `meta` nodes serve."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The intermediate's key sealed at rest, as the meter seals webhook secrets
# and pg-control role passwords (D2205; §83 §6.2).
age.workspace = true
async-trait.workspace = true
base64.workspace = true
connectrpc = { workspace = true, features = ["server"] }
hex.workspace = true
loams-proto.workspace = true
loams-transport = { path = "../loams-transport" }
rustls-pki-types = { version = "1.15", features = ["std", "alloc"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
