# Parquet — ★ connector 8 of §33 §8; CN1 plan Task 5.
# Runtime: native Rust, loams_flow::formats::parquet (design §33 §5, D354).
# §33 Appendix A.6: "Formats are codecs used by other connectors; Source and
# Sink mean decode and encode."  So `source` here is decode and `sink` is
# encode, and envelope.emits is empty — a codec has no CloudEvents type of its
# own because it never sits on a route (Ruling 2, §33 D355).
apiVersion: loams.flow/v1
kind: Connector
id: parquet
name: Parquet
specVersion: 1.0.0
category: format
priority: P1
starred: true
status: preview
runtime:
  kind: native
  ref: loams_flow::formats::parquet
  version: "parquet 59"
licence:
  component: Apache-2.0
  dependencies:
    parquet: Apache-2.0
    arrow: Apache-2.0                # the RecordBatch stream the codec decodes into and encodes from
capabilities:
  source:                          # decode: Parquet files and row groups → Arrow RecordBatches
    streaming: false               # §33 Appendix A.6 marks Streaming · for Parquet
    batch: true
    cdc: false
    webhook: false
    resumable: false              # a codec holds no position; the connector reading the objects does
    position: ""
  sink:                            # encode: Arrow RecordBatch → Parquet
    streaming: false
    batch: true
    transactional: false          # writing a file is not a transaction
    upsert: false
    delete: false
    idempotent: true               # encode is a pure function: the same batch gives the same bytes
  delivery: { source: at_least_once, sink: at_least_once }
    # A codec itself loses nothing, but at_least_once is the floor §33 §6 puts
    # under every runtime and no codec claims more.
  ordering: none                   # a codec preserves no order of its own (§33 §4's ordering enum)
  formats: [parquet]               # §33 Appendix A.6: the connector lists only its own format
  schema: { registry: none, evolution: none }
    # Parquet carries its schema in its own footer; there is nothing to evolve
    # and no registry (D356 keeps Avro at the Kafka boundary only).
  bulk: { arrow: true, max_batch_rows: 65536 }
    # arrow: true because the flag marks the columnar bulk path, and Parquet is
    # on it: formats::decode yields a RecordBatch stream and CN1 Ruling 3 has
    # the batch-of-rows event carry an Arrow IPC stream
    # (datacontenttype: application/vnd.apache.arrow.stream), so Parquet's
    # input encoding stops at the file boundary and never becomes per-row JSON
    # (D356, Ruling 3; CN1 "Rulings made during execution", row 3).  The
    # encoding on the wire into this connector is Parquet, which is what
    # capabilities.formats says.
  backpressure: pull               # a codec is called, not driven; it has no queue of its own
auth: [none]                       # §33 Appendix A.6
config:
  $ref: schemas/parquet.config.json
secrets: []
envelope:
  emits: ""                        # a format is a codec, not a source (§33 Appendix A.6, Ruling 2)
  consumes: "*"
  passthrough: false
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, bulk]
docs: docs/guides/connectors/parquet.md