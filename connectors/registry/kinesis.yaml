# Kinesis — ★ connector 19 of §33 §8; CN1 plan Task 13.
# Runtime: native Rust, loams_flow::connectors::kinesis, aws-sdk-kinesis
# (design §33 §5, D354), enhanced fan-out optional (CN1 Task 13).
# category is `messaging`: §33 Appendix A.1 puts ★ Kinesis in A.1 Messaging.
apiVersion: loams.flow/v1
kind: Connector
id: kinesis
name: Kinesis
specVersion: 1.0.0
category: messaging
priority: P1
starred: true
status: preview
runtime:
  kind: native
  ref: loams_flow::connectors::kinesis
  version: "aws-sdk-kinesis 1.x"
licence:
  component: Apache-2.0
  dependencies:
    aws-sdk-kinesis: Apache-2.0
    # connectors/licences.toml has no aws-sdk-kinesis component yet; CN1's Tech
    # Stack pins it at Apache-2.0.  Reviewer action: add the entry so D359's gate
    # can resolve the name (its --check fails on a component it cannot find).
capabilities:
  source:
    streaming: true
    batch: false
    cdc: false
    webhook: false
    resumable: true
    position: the per-shard sequence number
    # CN1 Task 13: shard iterators with a checkpointed sequence number per
    # shard, following resharding through parent and child shards.
  sink:
    streaming: true
    batch: true                   # PutRecords takes up to 500 records per call
    transactional: false          # Kinesis has no multi-record transaction
    upsert: false
    delete: false
    idempotent: false             # a retried PutRecords duplicates records (CN1 Task 13 retries partial failures)
  delivery: { source: at_least_once, sink: at_least_once }
  ordering: per_partition          # a shard's records keep sequence order (CN1 Task 13)
  formats: [cloudevents-binary, cloudevents-structured, json, bytes]
  schema: { registry: none, evolution: backward }
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: push-with-ack     # the producer's acknowledgement is the backpressure signal
auth: [iam, key]
    # iam for the AWS role chain (§33 Appendix A.1); key for the static
    # credentials the config schema names, which is how floci (D60) is addressed
    # in CI (CN1 plan Tech Stack).
config:
  $ref: schemas/kinesis.config.json
secrets: [access_key_id, secret_access_key, session_token]
    # The coordinator's list was [access_key_id, secret_access_key]; session_token
    # is a secret too when the credentials are temporary, so it is listed here to
    # keep CN1 Task 1's equality rule exact.  Reviewer decision noted.
envelope:
  emits: io.loams.dev.flow.kinesis.record.v1
  consumes: "*"
  passthrough: false
limits: { max_record_bytes: 16777216 }
conformance: [contract, kill-restart, dup-check]
docs: docs/guides/connectors/kinesis.md