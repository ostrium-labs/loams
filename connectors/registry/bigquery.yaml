# BigQuery — ★ connector 14 of §33 §8; CN1 plan Task 11.
# Runtime: native Rust, loams_flow::connectors::adbc, with the Apache-2.0
# BigQuery ADBC driver loaded by adbc_driver_manager 0.24 (§33 §8 row 14, D356).
# BigQuery's driver supports ExecutePartitions, which is what the source's
# partition split uses (CN1 Task 11).
apiVersion: loams.flow/v1
kind: Connector
id: bigquery
name: BigQuery
specVersion: 1.0.0
category: warehouse
priority: P1
starred: true
status: preview
runtime:
  kind: native
  ref: loams_flow::connectors::adbc
  version: "adbc_driver_manager 0.24 (BigQuery ADBC driver)"
licence:
  component: Apache-2.0
  dependencies:
    adbc_driver_manager: Apache-2.0
    adbc-driver-bigquery: Apache-2.0
capabilities:
  source:
    streaming: false              # CN1 reads with a query, not the Storage Write API
    batch: true
    cdc: false
    webhook: false
    resumable: true
    position: the query as-of position
    # §33 §6's run-id as-of position: the snapshot the query read.
  sink:
    streaming: false
    batch: true
    transactional: true           # bulk_ingest per Arrow batch (CN1 Task 11)
    upsert: false                 # the Storage Write API MERGE path is verified in Task 11, not declared here
    delete: false
    idempotent: false
  delivery: { source: at_least_once, sink: at_least_once }
  ordering: per_key
  formats: [cloudevents-binary, cloudevents-structured, json, arrow]
  schema: { registry: none, evolution: backward }
  bulk: { arrow: true, max_batch_rows: 65536 }
  backpressure: pull
auth: [sa]                        # §33 Appendix A.4: sa (service account or workload identity)
config:
  $ref: schemas/bigquery.config.json
secrets: [password, token]
envelope:
  emits: io.loams.dev.flow.bigquery.rows.v1
  consumes: "*"
  passthrough: false
limits: { batch_rows: 65536, batch_bytes: 8388608 }
conformance: [contract, roundtrip, bulk]
docs: docs/guides/connectors/bigquery.md