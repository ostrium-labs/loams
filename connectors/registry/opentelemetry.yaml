# OpenTelemetry — ★ connector 21 of §33 §8; CN1 plan Task 13.
# Runtime: native Rust, loams_flow::connectors::otlp — the OTLP/HTTP and
# OTLP/gRPC receivers on loams-fabric ingest's loopback listener
# (design §33 §5, D354; D111; §33 §2.2's remote-ingress note).
# category is `observability`: §33 Appendix A.13 puts ★ OpenTelemetry under
# Observability and incident.
# Source only, like webhooks: a collector or an agent pushes in.
apiVersion: loams.flow/v1
kind: Connector
id: opentelemetry
name: OpenTelemetry
specVersion: 1.0.0
category: observability
priority: P1
starred: true
status: preview
runtime:
  kind: native
  ref: loams_flow::connectors::otlp
  version: "opentelemetry-proto"
licence:
  component: Apache-2.0
  dependencies:
    opentelemetry-proto: Apache-2.0
capabilities:
  source:
    streaming: true
    batch: false
    cdc: false
    webhook: false
    resumable: false              # OTLP has no resume cursor: a collector re-exports, it does not resume
    position: ""
  delivery: { source: at_least_once, sink: at_least_once }
    # §33 §6's floor for every runtime; a collector's own retry and OTLP's
    # partial_success response make a re-export harmless (CN1 Task 13).
  ordering: none                   # OTLP does not order resource batches across requests
  formats: [cloudevents-binary, cloudevents-structured, json, protobuf]
    # protobuf and json because CN1 Task 13 accepts OTLP/HTTP in both encodings;
    # the CloudEvents modes cover the structured form (§33 §6).
  schema: { registry: none, evolution: backward }
    # OTLP carries its own protobuf schema per payload; no registry (D356).
  bulk: { arrow: false, max_batch_rows: 65536 }
  backpressure: pull              # ingest answers each request with its own result
auth: [key, mtls]                 # §33 Appendix A.13: key, mtls
config:
  $ref: schemas/opentelemetry.config.json
secrets: [auth.bearer_token, tls.key_pem]
envelope:
  emits: io.loams.dev.flow.opentelemetry.log.v1
    # Ruling 2's OTLP events are log, span and metric.  A manifest names one
    # concrete type and never "*", so the log signal is the one declared here and
    # the alternates are recorded in the config schema's `signals` enum:
    #   io.loams.dev.flow.opentelemetry.span.v1   for a trace signal
    #   io.loams.dev.flow.opentelemetry.metric.v1 for a metric signal
    # Reviewer decision noted: CN1 may want one manifest per signal.
  consumes: "*"
  passthrough: false
limits: { max_record_bytes: 16777216 }
conformance: [contract, kill-restart, dup-check]
docs: docs/guides/connectors/opentelemetry.md