# The Loams stack: everything a user runs themselves, on one machine
# or a VM of their own (BYOC, see byoc/install.sh). Configure it in .env (copy
# .env.example) and start it with
#
#   docker compose up -d
#
# The default is light enough for a laptop or one small VM: the engine on its
# embedded stores (metastore on openraft + redb, Live on redb, Durable on
# SQLite) with a local-folder bucket, Loams House, Loams Postgres on local
# folders, agentd and the tailnet sidecar. Single node, no replication: back
# up the volumes (docs/release/preview.md, "Durability").
#
# Profiles, set in .env as COMPOSE_PROFILES (comma-separated) so that every
# service and `loams upgrade` see the same set:
#
# - `tikv`: PD, TiKV and TiDB (Loams SQL); the engine's metastore and Live
#   move onto TiKV (config/stores.sh). Choose it before the first start: a
#   stack's data stays on the store it was started on.
# - `rustfs`: an S3 bucket (RustFS) for Loams Postgres's pageserver,
#   safekeeper and endpoint storage instead of local folders. Also before
#   the first start.
# - `kafka` (preview): Kafka clients (kcat, Kafka Connect, Flink, librdkafka)
#   on 127.0.0.1:9093, through the Kafka gateway of Ostrium's Iggy fork in
#   front of its own Iggy server. Never part of the default stack.
# - `connectors` (preview): `loams-fabric connect`, native connector instances
#   (Kafka and Confluent Cloud, Postgres and MySQL CDC) between Loams streams
#   and outside systems (design §80, D1821). Instance files in
#   ./connect/instances, secrets in ./secrets/connect. Never part of the
#   default stack.
# - `browser` (preview): Obscura, the agents' headless browser (D2114,
#   deploy/browser), behind loams-gateway's browser module (D2118); agentd
#   reaches the gateway, only the gateway reaches the engine; no published
#   port; set LOAMS_BROWSER_TOKEN, LOAMS_BROWSER_CLIENT_TOKEN and
#   LOAMS_BROWSER_PROVIDER=service.
# - `house-tailnet`: the House's own tailnet node (https://loams-house.<tailnet>/).
# - `postgres-control`: Loams Postgres's control plane.
# - `console`, `headscale` (coming soon): as below.
#
# Network exposure: nothing binds a host port on 0.0.0.0. Only the engine and
# the Tailscale sidecar share a network namespace (the `loams` service's); no
# other container may join it, because the engine trusts Tailscale identity
# headers on its tailscale listener (LOAMS_TAILSCALE_LISTEN, 127.0.0.1:7781),
# whose only client is the sidecar's `tailscale serve` proxy. The sidecar joins
# the user's Tailscale tailnet (Headscale is coming soon) and
# serves https://loams.<tailnet>/ from that listener. The engine serves the
# console there too, at https://loams.<tailnet>/ui/ (the image carries the
# console built from the same commit), so the console is same-origin with
# its API and reachable only on the tailnet. Every other service (pd, tikv, tidb,
# agentd, the Postgres stack) is on the compose network and cannot reach the
# engine's loopback listeners. The House is on a network of its own, with its
# own sidecar in its namespace (`house-tailscale`, https://loams-house.<tailnet>/).
# No service but `pg-runner` (`--profile postgres-control`) is given a
# container runtime's socket, and `pg-runner` is on an internal network that
# only `pg-control` joins.
# The few published ports (console, headscale, the Postgres stack's) are on
# 127.0.0.1 unless .env says otherwise.
name: loams

include:
  # The Loams Postgres (Neon) storage stack and its compute. Point
  # LOAMS_POSTGRES_COMPOSE at ./postgres-off.yaml to leave it out.
  - path: ${LOAMS_POSTGRES_COMPOSE:-../loams-postgres-dev/compose.yaml}

x-restart: &restart
  restart: unless-stopped

services:
  # PD, TiKV and TiDB: `tikv` profile only (Loams SQL, and the metastore and
  # Live on TiKV for scale).
  pd:
    <<: *restart
    profiles: [tikv]
    image: docker.io/pingcap/pd:${TIKV_TAG:-v8.5.8}
    command:
      - --name=pd
      - --data-dir=/data/pd
      - --config=/etc/pd.toml
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
    volumes:
      - pd-data:/data/pd
      - ./config/pd.toml:/etc/pd.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2379/pd/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  tikv:
    <<: *restart
    profiles: [tikv]
    image: docker.io/pingcap/tikv:${TIKV_TAG:-v8.5.8}
    command:
      - --pd-endpoints=pd:2379
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-status-addr=tikv:20180
      - --data-dir=/data/tikv
      - --config=/etc/tikv.toml
    # TiKV refuses to start below 82920 open files (Docker often defaults to
    # 65536).
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - tikv-data:/data/tikv
      # BR's `local://` backups of an upgrade snapshot (design §54 §7.2,
      # UP1 Task 9): TiKV writes the SSTs where the BR helper reads them.
      - ${LOAMS_UPGRADE_SNAPSHOT_DIR:-upgrade-snapshots}:/var/lib/loams-upgrade-snapshots
      - ./config/tikv.toml:/etc/tikv.toml:ro
    depends_on:
      pd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:20180/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Keyspace-mode TiDB (Loams SQL), MySQL protocol on tidb:4000 in the compose
  # network. Its root user starts without a password: set one before forwarding
  # 4000 over the tailnet.
  tidb:
    <<: *restart
    profiles: [tikv]
    image: ${TIDB_IMAGE:-ghcr.io/ostrium-labs/tidb:v8.5.8-loams.1}
    # The patched TiDB image is amd64 only: on Apple silicon and other arm64
    # hosts Docker Desktop runs it emulated (Rosetta or QEMU).
    platform: ${TIDB_PLATFORM:-linux/amd64}
    command:
      - --store=tikv
      - --path=pd:2379
      - --config=/etc/tidb.toml
      - --advertise-address=tidb
      - -P=4000
      - --status=10080
    volumes:
      - ./config/tidb.toml:/etc/tidb.toml:ro
    depends_on:
      tikv:
        condition: service_healthy

  # Upgrades (design §54 §6.1, UP1 Task 7): one-shot, before the engine, the
  # House and pg-control. It reads the stack record and the ledger in the
  # metastore, runs this release's pending migrations (and Durable's own),
  # and exits 0; on an ordinary restart there is nothing to do and it exits
  # in about a second. A failed migration exits non-zero, so nothing that
  # depends on it starts, and the old data stays readable. `loams upgrade`
  # runs it with the stack's previous release (--declared-release) and a
  # snapshot first. No listener, no published port, no tailnet door, no
  # container socket.
  migrate:
    image: ${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams:${LOAMS_VERSION:-0.1.2}
    # config/stores.sh adds the store flags the profiles select (--meta and
    # --live-store on TiKV with `tikv`; none, the embedded stores, without).
    entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "/etc/loams/stores.sh"]
    command:
      - migrate
      - run
      - --bucket=${LOAMS_BUCKET:-file:///var/lib/loams/bucket}
      - --data-dir=/var/lib/loams
      - --house-dir=/var/lib/loams-house
      - --pg-control-dir=/var/lib/loams-pg-control
      # Loams Postgres's storage APIs: `0001-safekeeper-volume` drains the
      # safekeeper before it is recreated. A stack composed without Postgres
      # (postgres-off.yaml) has no such names, and nothing to drain.
      - --pageserver=http://pageserver:9898
      - --safekeeper=http://safekeeper1:7676
    restart: "no"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      LOAMS_PROFILES: ${COMPOSE_PROFILES:-}
    # The engine's own settings (AWS_* for an s3:// LOAMS_BUCKET): no new
    # credentials (D944).
    env_file:
      - path: ./secrets/engine.env
        required: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - loams-data:/var/lib/loams
      - house-data:/var/lib/loams-house
      - pg-control-data:/var/lib/loams-pg-control
      # Upgrade snapshots (design §54 §7.3): mode 0700, kept on this host,
      # never uploaded. LOAMS_UPGRADE_SNAPSHOT_DIR puts them in a host
      # directory instead of the volume.
      - ${LOAMS_UPGRADE_SNAPSHOT_DIR:-upgrade-snapshots}:/var/lib/loams-upgrade-snapshots
      - ./config/stores.sh:/etc/loams/stores.sh:ro
    # PD and TiKV only with the `tikv` profile (`required: false`).
    depends_on:
      pd:
        condition: service_healthy
        required: false
      tikv:
        condition: service_healthy
        required: false

  loams:
    <<: *restart
    image: ${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams:${LOAMS_VERSION:-0.1.2}
    # The stores come from the profiles (config/stores.sh): embedded by
    # default, the metastore and Live on TiKV with `tikv`, Durable on SQLite
    # unless LOAMS_DURABLE_STORE says otherwise.
    entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "/etc/loams/stores.sh"]
    command:
      - standalone
      - --bucket=${LOAMS_BUCKET:-file:///var/lib/loams/bucket}
      - --data-dir=/var/lib/loams
      - --listen=${LOAMS_LISTEN:-127.0.0.1:8080}
      # standalone defaults Flight SQL to 0.0.0.0, which would put it on the
      # compose network; keep it on loopback like every other engine listener.
      - --flight-sql-listen=127.0.0.1:8082
      # The Postgres and MySQL wire listeners over collections (namespace
      # `default`). Loopback in the engine's network namespace, like Qdrant
      # (6333/6334), Elasticsearch (9200) and Flight SQL: they authenticate
      # nobody yet, so they are not on the tailnet (docs/release/preview.md,
      # "Keep the other listeners inside the stack").
      - --pg-listen=127.0.0.1:5432
      - --mysql-listen=127.0.0.1:3306
      - --graph-data-dir=/var/lib/loams/graph
      # The House link (HS1 Task 20) comes from LOAMS_HOUSE_* below.
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      LOAMS_PROFILES: ${COMPOSE_PROFILES:-}
      # Durable execution's store (Resonate): empty is SQLite in loams-data;
      # tikv://pd:2379/loams_durable (with the `tikv` profile) is a fresh
      # TiKV keyspace, for several engines (D261, D1342).
      LOAMS_DURABLE_STORE: ${LOAMS_DURABLE_STORE:-}
      # The House front over TLS on the `house-link` network (HS1 Task 20),
      # on by default. Empty: loams.house.v1 answers house_not_configured. The House makes its
      # certificate and its key in the house-link volume on first start; this
      # engine trusts that certificate alone for the link and signs in with that
      # key, after its own auth has let the caller in (the caller's credentials
      # are not passed on).
      LOAMS_HOUSE_ENDPOINT: ${LOAMS_HOUSE_ENDPOINT-https://house:8443}
      LOAMS_HOUSE_CA: /var/lib/loams-house-link/house.crt
      LOAMS_HOUSE_KEY_FILE: /var/lib/loams-house-link/link.key
      # Engine auth: tailscale | oidc | apikey | off (loopback only).
      # tailscale trusts the Tailscale-User-Login headers that the sidecar's
      # `tailscale serve` proxy adds, on LOAMS_TAILSCALE_LISTEN only: a loopback
      # port of its own that is the serve target and nothing else.
      LOAMS_AUTH_MODE: ${LOAMS_AUTH_MODE:-tailscale}
      # Extra browser origins allowed to call the engine (comma-separated exact
      # origins). None by default: the console the engine serves at /ui/ is
      # same-origin, and Loams Desktop sends the engine's own origin. Add one
      # only for a console you serve from another origin (`--profile console`).
      LOAMS_CORS_ORIGINS: ${LOAMS_CORS_ORIGINS:-}
      # The remote agentd hosts (`loams-agentd serve --remote`) Studio in the
      # console at /ui/ may call: exact origins, spaces or commas. They join the
      # console's Content-Security-Policy header's connect-src. None by default.
      LOAMS_AGENTD_ORIGINS: ${LOAMS_AGENTD_ORIGINS:-}
      LOAMS_TAILSCALE_LISTEN: ${LOAMS_TAILSCALE_LISTEN:-127.0.0.1:7781}
      # The connect socket (CC1 ruling R1.1): the main API on a Unix socket in
      # the connect-run volume, which only the engine and `connect`
      # (`--profile connectors`) mount. API keys only, whatever
      # LOAMS_AUTH_MODE says; Tailscale headers are never read there. Set it
      # empty to serve no socket.
      LOAMS_CONNECT_SOCKET: ${LOAMS_CONNECT_SOCKET-/run/loams-connect/engine.sock}
      LOAMS_OIDC_ISSUER: ${LOAMS_OIDC_ISSUER:-https://auth.loams.dev}
      LOAMS_OIDC_AUDIENCE: ${LOAMS_OIDC_AUDIENCE:-loams-console}
      LOAMS_OIDC_ALLOWED_EMAILS: ${LOAMS_OIDC_ALLOWED_EMAILS:-}
      LOAMS_OIDC_ALLOWED_SUBJECTS: ${LOAMS_OIDC_ALLOWED_SUBJECTS:-}
      LOAMS_OIDC_ALLOWED_GROUPS: ${LOAMS_OIDC_ALLOWED_GROUPS:-}
      LOAMS_TAILSCALE_ALLOWED_USERS: ${LOAMS_TAILSCALE_ALLOWED_USERS:-}
      LOAMS_API_KEYS_FILE: /etc/loams/secrets/api-keys
      # The authorizer (design 76): builtin (the default: model v1 over the engine's own
      # principal store) or openfga (the `authz` profile, below). The store and model ids
      # come from openfga-init (config/stores.sh) unless set here.
      LOAMS_AUTHZ: ${LOAMS_AUTHZ:-builtin}
      LOAMS_AUTHZ_OPENFGA_GRPC: ${LOAMS_AUTHZ_OPENFGA_GRPC:-http://openfga:8081}
      LOAMS_AUTHZ_OPENFGA_STORE: ${LOAMS_AUTHZ_OPENFGA_STORE:-}
      LOAMS_AUTHZ_OPENFGA_MODEL: ${LOAMS_AUTHZ_OPENFGA_MODEL:-}
      LOAMS_AUTHZ_OPENFGA_KEY: ${LOAMS_AUTHZ_OPENFGA_KEY:-}
    # LOAMS_SETUP_TOKEN, for first-run setup with auth on (the console's
    # setup page asks for it once, to create the org and its owner), comes
    # through config/setup-token.env: it reads the value from .env, and
    # secrets/engine.env, listed after it, wins when both set one. It is not
    # under `environment:`, which would override secrets/engine.env.
    # Further engine settings, such as AWS_* credentials for an s3://
    # LOAMS_BUCKET, kept out of compose.yaml.
    env_file:
      - path: ./config/setup-token.env
        required: false
      - path: ./secrets/engine.env
        required: false
    networks: [default, house-link, authz]
    volumes:
      - loams-data:/var/lib/loams
      - ./secrets:/etc/loams/secrets:ro
      - house-link:/var/lib/loams-house-link:ro
      - ./config/stores.sh:/etc/loams/stores.sh:ro
      # The OpenFGA store and model ids (`authz` profile), read when LOAMS_AUTHZ=openfga.
      - authz:/var/lib/loams-authz:ro
      - connect-run:/run/loams-connect
    depends_on:
      pd:
        condition: service_healthy
        required: false
      tikv:
        condition: service_healthy
        required: false
      migrate:
        condition: service_completed_successfully
      # The engine reads the House's certificate at start (LOAMS_HOUSE_CA),
      # which the House writes on its first start. Optional: an engine whose
      # House does not come up (no Landlock TCP rules before Linux 6.7)
      # still starts once the House has written it.
      house:
        condition: service_healthy
        required: false
      # With the `authz` profile, OpenFGA's store and model exist before the engine starts.
      openfga-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

  # Loams House (the ClickHouse HTTP interface, loams-fabric with its chDB
  # workers), on by default. Two doors:
  #
  # - Its plaintext listener stays on loopback (D111). The `house-tailscale`
  #   sidecar (`--profile house-tailnet`) shares its network namespace and serves
  #   https://loams-house.<tailnet>/ from 127.0.0.1:8123 (TLS from the tailnet's
  #   certificates, reachable only by tailnet members the policy lets in).
  # - Its TLS listener, 0.0.0.0:8443 (HS1 Task 20), is the engine's link. It is
  #   reached on `house-link`, a network only the engine and the House join,
  #   with a self-signed certificate the House makes on first start. The engine
  #   trusts that certificate alone and signs in with the link key; both are
  #   in the house-link volume, which the engine mounts read-only. The link
  #   acts for the Loams principal the engine authenticated, with the scopes
  #   and tables HOUSE_PRINCIPALS gives it; a principal not listed has no House
  #   access, and every statement is in the House's audit log
  #   (/var/lib/loams-house/audit.log). LOAMS_HOUSE_ENDPOINT
  #   (https://house:8443 by default) wires the engine to it, so the
  #   console's House page works; set it empty to leave the link off.
  #
  # Clients of the tailnet door sign in as ClickHouse user `default` with the
  # password in /var/lib/loams-house/house.key (created on first start).
  # Nothing else in the stack can reach the House, and its workers reach
  # nothing of the stack.
  #
  # Workers run sealed (L3): HOUSE_SANDBOX=pods (the default) is Landlock (TCP
  # rules, Linux 6.7 or later) and seccomp, inside this container and its own
  # network; netns adds a user and network namespace per worker, which needs
  # unprivileged user namespaces in the container (Podman's default; Docker's
  # default seccomp profile refuses them). The worker refuses to boot when its
  # sandbox cannot be put in force. chDB's access control (R-ACL.1) and the
  # statement checks (L1) are always on.
  # One-shot, before the House: gives the house-link volume to the House's
  # uid (10001). The fabric image has no /var/lib/loams-house-link, so Docker
  # creates a fresh volume owned by root and the House could not write its
  # certificate there (Podman hands it to the container's user itself). No
  # network, every capability dropped but CHOWN and FOWNER.
  house-init:
    image: ${HOUSE_IMAGE:-${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams-fabric:${LOAMS_VERSION:-0.1.2}}
    restart: "no"
    user: "0:0"
    network_mode: none
    # CHOWN for the owner, FOWNER for the mode whoever owns it now.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -eu; dir=/var/lib/loams-house-link; ls -ldn "$$dir";
        chown 10001:10001 "$$dir"; chmod 0750 "$$dir"; ls -ldn "$$dir"
    volumes:
      - house-link:/var/lib/loams-house-link

  house:
    <<: *restart
    image: ${HOUSE_IMAGE:-${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams-fabric:${LOAMS_VERSION:-0.1.2}}
    command:
      - house
      - --single-node
      - --data-dir=/var/lib/loams-house
      - --sandbox=${HOUSE_SANDBOX:-pods}
      - --house-tls-listen=0.0.0.0:8443
      - --house-tls-cert=/var/lib/loams-house-link/house.crt
      - --house-tls-key=/var/lib/loams-house/tls/house.key
      # The engine's link key (it acts for the principals below) and the
      # Loams principals it may act for (HS1 Task 20): `principal=scopes`,
      # `;`-separated; a principal not listed has no House access.
      - --link-key-file=/var/lib/loams-house-link/link.key
      - --principals=${HOUSE_PRINCIPALS:-}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    networks: [house, house-link]
    volumes:
      - house-data:/var/lib/loams-house
      - house-link:/var/lib/loams-house-link
    # Healthy once it answers on loopback and its link certificate (which
    # the engine reads at start) is written.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8123/ping && test -s /var/lib/loams-house-link/house.crt"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully
      house-init:
        condition: service_completed_successfully

  # `loams-fabric connect` (`--profile connectors`, preview; design §80 §4.4,
  # D1821): native connector instances, one YAML file each in
  # ./connect/instances, reading outside systems into Loams streams and Loams
  # streams out to them. It reaches the engine only through the connect
  # socket (connect-run, a volume no other service mounts) with the API key
  # in ./secrets/connect/engine-key, and joins no other service's network
  # namespace (CC1 ruling R1.1). Its connectors reach out (Confluent Cloud,
  # your databases); nothing reaches in: no published port, and its admin
  # API (status, pause, resume, rate) is on its own loopback, 127.0.0.1:7790.
  # Secrets are files under ./secrets/connect/<namespace_id>/<secret>/<key>,
  # owner-only (the BYOC fetcher writes them); instance files name them.
  # Its lock, checkpoints and controls are in its own volume unless
  # LOAMS_CONNECT_STORE names the bucket (s3://…, with AWS_* in
  # secrets/connect.env).
  connect:
    <<: *restart
    profiles: [connectors]
    image: ${HOUSE_IMAGE:-${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams-fabric:${LOAMS_VERSION:-0.1.2}}
    command:
      - connect
      - --instances=/etc/loams/connect
      - --engine=unix:///run/loams-connect/engine.sock
      - --secrets-root=/var/lib/loams-connect/secrets
      - --store=${LOAMS_CONNECT_STORE:-file:///var/lib/loams-connect/state}
      - --admin-listen=127.0.0.1:7790
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    env_file:
      - path: ./secrets/connect.env
        required: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - connect-run:/run/loams-connect
      - connect-state:/var/lib/loams-connect/state
      - ./connect/instances:/etc/loams/connect:ro
      - ./secrets/connect:/var/lib/loams-connect/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7790/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      loams:
        condition: service_healthy

  # The House's tailnet node (`--profile house-tailnet`), in the House's
  # network namespace (its only neighbour there). A second node on the
  # tailnet: give it its own auth key (HOUSE_TS_AUTHKEY) or a reusable
  # TS_AUTHKEY. Without it the House is reached through the engine only.
  house-tailscale:
    <<: *restart
    profiles: [house-tailnet]
    image: docker.io/tailscale/tailscale:${TAILSCALE_TAG:-v1.90.6}
    network_mode: service:house
    environment:
      TS_AUTHKEY: ${HOUSE_TS_AUTHKEY:-${TS_AUTHKEY:-}}
      TS_HOSTNAME: ${HOUSE_TS_HOSTNAME:-loams-house}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/house-serve-https.json
      TS_EXTRA_ARGS: --login-server=${TS_LOGIN_SERVER:-https://controlplane.tailscale.com} ${TS_EXTRA_ARGS:-}
    volumes:
      - house-tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      house:
        condition: service_started

  # The only way in from outside: a tailnet node named TS_HOSTNAME in the
  # engine's network namespace, the only container besides the engine there. Userspace networking needs no extra
  # capabilities or /dev/net/tun.
  tailscale:
    <<: *restart
    image: docker.io/tailscale/tailscale:${TAILSCALE_TAG:-v1.90.6}
    network_mode: service:loams
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-loams}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      # https (Tailscale: MagicDNS + HTTPS certificates), or http for Headscale
      # (coming soon, unsupported in 0.1.1); see tailscale/serve-*.json.
      TS_SERVE_CONFIG: /config/serve-${TS_SERVE_MODE:-https}.json
      TS_EXTRA_ARGS: --login-server=${TS_LOGIN_SERVER:-https://controlplane.tailscale.com} ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      loams:
        condition: service_started

  # COMING SOON, unsupported in 0.1.1: Headscale issues no ts.net
  # HTTPS certificates, so the hosted console cannot reach an engine on it.
  # A self-hosted tailnet control server (`--profile headscale`). Clients,
  # including the browser's device, must reach HEADSCALE_SERVER_URL, so on a VM
  # set HEADSCALE_BIND=0.0.0.0 (and TLS in front of it) or reach it over SSH.
  headscale:
    <<: *restart
    profiles: [headscale]
    image: docker.io/headscale/headscale:${HEADSCALE_TAG:-0.26.1}
    command: [serve]
    environment:
      HEADSCALE_SERVER_URL: ${HEADSCALE_SERVER_URL:-http://127.0.0.1:8090}
      HEADSCALE_DNS_BASE_DOMAIN: ${HEADSCALE_BASE_DOMAIN:-loams.internal}
    ports:
      - ${HEADSCALE_BIND:-127.0.0.1}:${HEADSCALE_PORT:-8090}:8080
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale

  # A console on an origin of its own (`--profile console`; optional). The
  # engine already serves the console at https://loams.<tailnet>/ui/; use this
  # only for a console you build yourself and serve from this machine.
  # LOAMS_CONSOLE_DIR is a built console (web/apps/console's `pnpm build`
  # output); /config.json carries its runtime configuration. Its origin must
  # be in LOAMS_CORS_ORIGINS.
  console:
    <<: *restart
    profiles: [console]
    image: docker.io/nginxinc/nginx-unprivileged:${NGINX_TAG:-1.29-alpine}
    environment:
      LOAMS_ENGINE_URL: ${LOAMS_ENGINE_URL:-}
      LOAMS_AUTH_ISSUER: ${LOAMS_AUTH_ISSUER:-https://auth.loams.dev}
      LOAMS_AUTH_CLIENT_ID: ${LOAMS_AUTH_CLIENT_ID:-loams-console}
    ports:
      - ${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-3000}:8080
    volumes:
      - ${LOAMS_CONSOLE_DIR:-./console/dist}:/usr/share/nginx/html:ro
      - ./console/default.conf.template:/etc/nginx/templates/default.conf.template:ro

  # Loams Postgres's control plane (`--profile postgres-control`, PG2 ruling
  # R-REL.1): loams.postgres.v1 on 127.0.0.1:${PG_CONTROL_PORT:-7680}, API keys
  # from secrets/pg-api-keys.json (`loams pg-api-key` mints them; see the
  # README), the upcalls on the compose network for the computes. It holds no
  # container runtime socket: it drives computes through `pg-runner`, on the
  # `pg-runner` network, with the token `pg-runner` writes into the shared
  # pg-runner-token volume. Its records are in its own volume (one node).
  pg-control:
    <<: *restart
    profiles: [postgres-control]
    image: ${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams-pg-control:${LOAMS_VERSION:-0.1.2}
    command:
      - pg-control
      - --store=local
      - --data-dir=/var/lib/loams-pg-control
      - --runtime=compose
      - --compute-runner=http://pg-runner:7691
      - --compute-runner-token-file=/run/pg-runner/token
      - --listen=0.0.0.0:7680
      - --pg-upcall-listen=0.0.0.0:7690
      - --pg-authz=api-key
      - --pg-api-keys=/etc/loams-pg-control/api-keys.json
      # The included Postgres stack (deploy/loams-postgres-dev): its
      # pageserver (node 1234) and safekeeper.
      - --pageserver=http://pageserver:9898
      - --wal=http://safekeeper1:7676
      - --pageserver-pg=1234=postgresql://no_user@pageserver:6400
      - --default-pageserver=1234
      - --wal-pool=default=safekeeper1:5454
      # Endpoint storage (below): the computes keep their file cache's state
      # there, and pg-control writes the key it checks their tokens with.
      - --endpoint-storage=endpoint-storage:51243
      - --endpoint-storage-pem-out=/run/endpoint-storage/key.pem
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    networks: [default, pg-runner]
    ports:
      - ${PG_CONTROL_BIND:-127.0.0.1}:${PG_CONTROL_PORT:-7680}:7680
    volumes:
      - pg-control-data:/var/lib/loams-pg-control
      - pg-runner-token:/run/pg-runner:ro
      - pg-endpoint-storage-key:/run/endpoint-storage
      - type: bind
        source: ./secrets/pg-api-keys.json
        target: /etc/loams-pg-control/api-keys.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      pg-runner:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Endpoint storage (PG2 Task 16, the fork's endpoint_storage from the
  # storage image the included stack runs): where computes keep their local
  # file cache's state in the stack's bucket, so a promoted read-only
  # endpoint starts with a warm cache. It checks the computes' tokens with
  # pg-control's public key, which pg-control writes at start into a volume
  # mounted read-only here. Only computes reach it (no ports). Nothing
  # orders it before the first compute starts (`service_started` only orders
  # the containers): a compute that prewarms before it listens starts with a
  # cold cache, which is all that is lost.
  endpoint-storage:
    <<: *restart
    profiles: [postgres-control]
    image: ${NEON_IMAGE:-ghcr.io/ostrium-labs/loams-postgres-storage@sha256:4dcec4cbef637b92b1088ea2c0bc857f3b5ef4318f02e8d2d4a0f9263ed4140e}
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_REGION: us-east-1
      LOAMS_PROFILES: ${COMPOSE_PROFILES:-}
    # The bucket: RustFS's `neon` with the `rustfs` profile, else a local
    # folder in its own volume.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until [ -s /run/endpoint-storage/key.pem ]; do echo "waiting for the pg-control key"; sleep 1; done;
        case ",$${LOAMS_PROFILES}," in
        *,rustfs,*) storage='"type": "AwsS3", "bucket_name": "neon", "bucket_region": "us-east-1",
        "prefix_in_bucket": "endpoint-storage/", "endpoint": "http://rustfs:9000"' ;;
        *) mkdir -p /data/.neon/endpoint-storage; storage='"type": "LocalFs", "local_path": "/data/.neon/endpoint-storage"' ;;
        esac;
        exec endpoint_storage --config="{\"listen\": \"0.0.0.0:51243\",
        \"pemfile\": \"/run/endpoint-storage/key.pem\", $${storage}}"
    volumes:
      - pg-endpoint-storage-key:/run/endpoint-storage:ro
      - pg-endpoint-storage:/data/.neon
    depends_on:
      pg-control:
        condition: service_started

  # The compute runner: the only service given a container runtime's socket
  # (CONTAINER_SOCKET; prefer rootless Podman's, see the README). It runs
  # the computes as compose projects `loams-pg-<namespace>` on the stack's
  # network (PG_COMPUTE_NETWORK), each one publishing its endpoint's port on
  # PG_ENDPOINT_BIND, and serves only `pg-control`: its own network is
  # internal (no route out) and nothing else joins it, every call needs the
  # token, and it starts nothing but the compute images pinned in
  # deploy/pins/loams-postgres-images.toml (never a neon-archive copy), from
  # compose files it renders itself (no mounts, no privileges, no host
  # network).
  pg-runner:
    <<: *restart
    profiles: [postgres-control]
    image: ${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams-pg-control:${LOAMS_VERSION:-0.1.2}
    command:
      - pg-runner
      - --listen=0.0.0.0:7691
      - --token-file=/run/pg-runner/token
      - --create-token
      - --data-dir=/var/lib/loams-pg-runner
      - --compose-network=${PG_COMPUTE_NETWORK:-loams_default}
      - --compute-control-plane-uri=http://pg-control:7690
      - --compose-publish-ip=${PG_ENDPOINT_BIND:-127.0.0.1}
      - --compute-ctl-reach=network
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DOCKER_HOST: unix:///var/run/docker.sock
    # The socket's group (`stat -c %g` of it): 0 under rootless Podman, the
    # docker group's id under rootful Docker.
    group_add:
      - "${CONTAINER_SOCKET_GID:-0}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [pg-runner]
    volumes:
      - pg-runner-data:/var/lib/loams-pg-runner
      - pg-runner-token:/run/pg-runner
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7691/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The agent daemon, on by default; its config is agentd/config.toml. It
  # supervises its own engine, so it needs nothing from this one and stays on
  # the compose network.
  agentd:
    <<: *restart
    image: ${AGENTD_IMAGE:-${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams-agentd:${LOAMS_VERSION:-0.1.2}}
    # The daemon writes its token, lock and store beside its config.toml, in
    # a directory it makes owner-only (0700): that is /home/loams/agentd, in
    # the data volume. Only config.toml comes from ./agentd, read-only, and
    # ./agentd stays at /etc/loams-agentd for what the config names (TLS
    # files). Mounting ./agentd as the config directory itself, as before,
    # left the daemon unable to write its token or lock (SD1 Task 30).
    volumes:
      - agentd-data:/home/loams
      - ./agentd/config.toml:/home/loams/agentd/config.toml:ro
      - ./agentd:/etc/loams-agentd:ro
    # The agents' headless browser (D2111, D2116, D2118): `local` launches
    # the Obscura the image carries (LOAMS_OBSCURA_BIN) inside this container,
    # per agent run; `service` goes through `browser-gateway` with a client
    # token of its own, so agentd never holds the engine's token. The
    # provider names the client token by reference (env:browser-token),
    # which the bridge's env resolver reads from
    # LOAMS_WEB_BRIDGE_SECRET_BROWSER_TOKEN.
    environment:
      LOAMS_BROWSER_PROVIDER: ${LOAMS_BROWSER_PROVIDER:-local}
      LOAMS_BROWSER_SERVICE_URL: ws://browser-gateway:9223/devtools/browser
      LOAMS_BROWSER_SERVICE_TOKEN_REF: env:browser-token
      LOAMS_WEB_BRIDGE_SECRET_BROWSER_TOKEN: ${LOAMS_BROWSER_CLIENT_TOKEN:-}
    networks:
      - default
      - browser

  # The `browser` profile (D2110-D2114, D2118, preview): Obscura 0.2.3, the
  # same engine agentd launches on a laptop, pinned by digest
  # (deploy/browser). No published port. On `browser-engine` (internal:
  # browser-gateway only) and on `browser-egress` (its own route out, shared
  # with nobody). The engine
  # refuses a non-loopback bind unless OBSCURA_CDP_TOKEN is at least 32 bytes,
  # so an unset LOAMS_BROWSER_TOKEN stops it rather than exposing it. Each
  # agent page is a throwaway browser context; nothing is stored.
  browser:
    <<: *restart
    profiles: [browser]
    image: ${BROWSER_IMAGE:-docker.io/h4ckf0r0day/obscura:0.2.3@sha256:475def3ddf1ec513b3d1bc36e8ad15f0d192538cb15f814c77215aa70c418ca2}
    command: ["serve", "--port", "9222", "--host", "0.0.0.0", "--workers", "${BROWSER_WORKERS:-2}"]
    environment:
      OBSCURA_CDP_TOKEN: ${LOAMS_BROWSER_TOKEN:-}
      OBSCURA_CDP_COMMAND_TIMEOUT_MS: "60000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - browser-engine
      - browser-egress

  # loams-gateway's browser module (D2118): the only way to the engine.
  # agentd connects with LOAMS_BROWSER_CLIENT_TOKEN, whose SHA-256 is the
  # gateway's client list; the gateway opens the engine with
  # LOAMS_BROWSER_TOKEN, which nothing else on agentd's side holds. Both are
  # written to a private tmpfs at start. No published port; an empty token
  # stops it.
  browser-gateway:
    <<: *restart
    profiles: [browser]
    image: ${BROWSER_GATEWAY_IMAGE:-${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams-gateway:${LOAMS_VERSION:-0.1.2}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        [ "$${#ENGINE_TOKEN}" -ge 32 ] || { echo "browser-gateway: set LOAMS_BROWSER_TOKEN (32+ bytes)" >&2; exit 1; }
        [ "$${#CLIENT_TOKEN}" -ge 32 ] || { echo "browser-gateway: set LOAMS_BROWSER_CLIENT_TOKEN (32+ bytes)" >&2; exit 1; }
        printf %s "$$ENGINE_TOKEN" > /run/browser-gateway/engine-token
        printf %s "$$CLIENT_TOKEN" | sha256sum | cut -d' ' -f1 > /run/browser-gateway/clients
        unset ENGINE_TOKEN CLIENT_TOKEN
        printf '%s\n' \
          'listen = "0.0.0.0:9223"' \
          'upstream = "browser:9222"' \
          'upstream_token_file = "/run/browser-gateway/engine-token"' \
          'client_tokens_file = "/run/browser-gateway/clients"' \
          > /run/browser-gateway/browser.toml
        exec /usr/bin/tini -- /usr/local/bin/loams-gateway --module browser --config /run/browser-gateway/browser.toml
    environment:
      ENGINE_TOKEN: ${LOAMS_BROWSER_TOKEN:-}
      CLIENT_TOKEN: ${LOAMS_BROWSER_CLIENT_TOKEN:-}
      RUST_LOG: ${BROWSER_GATEWAY_LOG:-info}
    tmpfs:
      - /run/browser-gateway:mode=0700,uid=10001,gid=10001
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - browser
      - browser-engine

  # The Kafka profile (D1796-D1798, preview): one image of Ostrium's fork of
  # Apache Iggy (ostrium-labs/iggy) holds both `iggy-server` and
  # `iggy-gateway-kafka`, so the two always run as the one tested pair; it is
  # pinned by digest in IGGY_KAFKA_IMAGE (.env.example). Off unless
  # COMPOSE_PROFILES has `kafka`: the default stack stays light.
  #
  # `iggy` is the broker's own storage, on the compose network only (no
  # published port), and no other service depends on it. Iggy's I/O is io_uring,
  # which Docker's default seccomp profile refuses, hence the unconfined
  # profile and SYS_NICE its own quick start uses.
  iggy:
    <<: *restart
    profiles: [kafka]
    image: ${IGGY_KAFKA_IMAGE:-ghcr.io/ostrium-labs/iggy@sha256:649c20714dcde257131be46e456ab32bf62d283a047c26b41b3c8c3132cea332}
    # The guard refuses to start while KAFKA_IGGY_PASSWORD is empty or still
    # the .env.example placeholder (config/kafka-guard.sh).
    entrypoint: ["/bin/sh", "/etc/loams/kafka-guard.sh", "IGGY_ROOT_PASSWORD"]
    command: ["/usr/local/bin/iggy-server"]
    cap_add: [SYS_NICE]
    security_opt: ["seccomp:unconfined"]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      IGGY_NODE_ADVERTISED_ADDRESS: iggy
      # The gateway signs in as this user. Set the password in .env before
      # the first start (the guard refuses the placeholder): Iggy keeps it in
      # its data volume.
      IGGY_ROOT_USERNAME: ${KAFKA_IGGY_USER:-iggy}
      IGGY_ROOT_PASSWORD: ${KAFKA_IGGY_PASSWORD:-}
      # The gateway reaches the server over the compose network.
      IGGY_TCP_ADDRESS: 0.0.0.0:8090
      IGGY_HTTP_ADDRESS: 0.0.0.0:3000
      IGGY_QUIC_ADDRESS: 0.0.0.0:8080
      IGGY_WEBSOCKET_ADDRESS: 0.0.0.0:8092
    volumes:
      - iggy-data:/app/local_data
      - ./config/kafka-guard.sh:/etc/loams/kafka-guard.sh:ro
    # `ping` is unauthenticated and answers once the request loop is up.
    healthcheck:
      test: ["CMD", "/usr/local/bin/iggy", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 30

  # The Kafka wire front end, on loopback by default (KAFKA_BIND). With SASL
  # off (the default) anyone who reaches the port can create and delete
  # topics, so keep it on loopback or turn KAFKA_SASL_ENABLED on and give
  # clients an Iggy user's name and password (SASL/PLAIN: use it over the
  # tailnet or a TLS listener, not in clear over a network you do not own).
  # Transactions and exactly-once are not supported.
  kafka-gateway:
    <<: *restart
    profiles: [kafka]
    image: ${IGGY_KAFKA_IMAGE:-ghcr.io/ostrium-labs/iggy@sha256:649c20714dcde257131be46e456ab32bf62d283a047c26b41b3c8c3132cea332}
    entrypoint: ["/bin/sh", "/etc/loams/kafka-guard.sh", "IGGY_KAFKA_IGGY_PASSWORD"]
    command: ["/usr/local/bin/iggy-gateway-kafka"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      IGGY_KAFKA_BIND_ADDR: 0.0.0.0:9093
      # What a client's Metadata response points it back at: the host and port
      # the client reaches the published port on.
      IGGY_KAFKA_ADVERTISED_HOST: ${KAFKA_ADVERTISED_HOST:-127.0.0.1}
      IGGY_KAFKA_ADVERTISED_PORT: ${KAFKA_PORT:-9093}
      IGGY_KAFKA_BRIDGE_ENABLED: "true"
      IGGY_KAFKA_IGGY_ADDR: iggy:8090
      IGGY_KAFKA_IGGY_USERNAME: ${KAFKA_IGGY_USER:-iggy}
      IGGY_KAFKA_IGGY_PASSWORD: ${KAFKA_IGGY_PASSWORD:-}
      IGGY_KAFKA_SASL_ENABLED: ${KAFKA_SASL_ENABLED:-false}
      IGGY_KAFKA_AUTO_CREATE_TOPICS_ENABLED: ${KAFKA_AUTO_CREATE_TOPICS:-false}
    volumes:
      - ./config/kafka-guard.sh:/etc/loams/kafka-guard.sh:ro
    ports:
      - ${KAFKA_BIND:-127.0.0.1}:${KAFKA_PORT:-9093}:9093
    depends_on:
      iggy:
        condition: service_healthy
    # The listener binds after the bridge has signed in to Iggy, so an
    # answering port means a working bridge.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9093"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  # The `authz` profile (design 76, D1610, D1613): OpenFGA, for LOAMS_AUTHZ=openfga. Off by
  # default; the engine's default authorizer is built in (model v1 over its own principal
  # store) and needs nothing here. OpenFGA v1.22.0 (Apache-2.0), its official image pinned by
  # digest, unmodified.
  #
  # - SQLite in the openfga-data volume: one user's install only (D1626). A multi-user
  #   install runs OpenFGA on Postgres (deploy/openfga/helm).
  # - OpenFGA's own check caches stay off: the engine keeps the one decision cache, allows
  #   only, 5 s (D1625).
  # - On the `authz` network only (internal, no route out, no published port): the engine,
  #   OpenFGA and its init job. Every call needs LOAMS_AUTHZ_OPENFGA_KEY (OpenFGA's preshared
  #   key; it refuses to start without one).
  # - openfga-init creates the `loams` store, writes model v1
  #   (config/openfga-model.json, generated from deploy/openfga) when it changed, and records
  #   their ids in the authz volume, where the engine reads them (config/stores.sh).
  #
  # The engine stays on the built-in authorizer until .env sets LOAMS_AUTHZ=openfga. OpenFGA's
  # tuples come from the sync bridge (plan IA1, IA3); before it runs, an engine on OpenFGA
  # denies every principal but the operator.
  openfga-migrate:
    profiles: [authz]
    image: &openfga-image docker.io/openfga/openfga:v1.22.0@sha256:9cf9a20af32a40434cd3a788c429879439ee9ea9abf65c9c200ee17cd43f769e
    command: migrate --datastore-engine sqlite --datastore-uri file:/home/nonroot/openfga.db
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [authz]
    volumes:
      # The image's /home/nonroot belongs to its user (65532), and a new volume takes that
      # owner, so OpenFGA never runs as root.
      - openfga-data:/home/nonroot

  openfga:
    <<: *restart
    profiles: [authz]
    image: *openfga-image
    command:
      - run
      - --datastore-engine=sqlite
      - --datastore-uri=file:/home/nonroot/openfga.db
      - --playground-enabled=false
      - --http-addr=0.0.0.0:8080
      - --grpc-addr=0.0.0.0:8081
      - --log-format=json
      - --log-level=warn
      - --check-query-cache-enabled=false
      - --check-iterator-cache-enabled=false
    environment:
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${LOAMS_AUTHZ_OPENFGA_KEY:-}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [authz]
    volumes:
      - openfga-data:/home/nonroot
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  openfga-init:
    profiles: [authz]
    image: ${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams:${LOAMS_VERSION:-0.1.2}
    entrypoint: ["/bin/sh", "/etc/loams/openfga-init.sh"]
    command: []
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      LOAMS_AUTHZ_OPENFGA_KEY: ${LOAMS_AUTHZ_OPENFGA_KEY:-}
      LOAMS_AUTHZ_DIR: /var/lib/loams-house
    networks: [authz]
    volumes:
      # Mounted on a directory the image gives its user (10001), so a new volume takes that
      # owner and the job runs as that user; the engine reads it at /var/lib/loams-authz.
      - authz:/var/lib/loams-house
      - ./config/openfga-init.sh:/etc/loams/openfga-init.sh:ro
      - ./config/openfga-model.json:/etc/loams/openfga-model.json:ro
    healthcheck:
      disable: true
    depends_on:
      openfga:
        condition: service_healthy

networks:
  # The House's own network (see `house`): no other service joins it.
  house: {}
  # The engine's link to the House's TLS listener (see `house`): the two of
  # them only, with no route out.
  house-link:
    internal: true
  # `pg-control` and `pg-runner` only, with no route out (see `pg-runner`).
  pg-runner:
    internal: true
  # The engine, OpenFGA and openfga-init only, with no route out (`authz` profile).
  authz:
    internal: true
  # agentd and browser-gateway only, with no route out.
  browser:
    internal: true
  # browser-gateway and the engine only, with no route out: agentd cannot
  # reach the engine directly.
  browser-engine:
    internal: true
  # The browser engine's own way out to the web; no other service joins it.
  browser-egress: {}

volumes:
  pd-data:
  tikv-data:
  loams-data:
  house-data:
  # The House's certificate and the link key, which the engine reads (see
  # `house`).
  house-link:
  house-tailscale-state:
  tailscale-state:
  headscale-data:
  agentd-data:
  # The `kafka` profile's Iggy data.
  iggy-data:
  # The engine's connect socket (CC1 ruling R1.1): the engine and `connect`
  # only.
  connect-run:
  # `connect`'s lock, checkpoints and controls (unless LOAMS_CONNECT_STORE).
  connect-state:
  pg-control-data:
  pg-runner-data:
  pg-runner-token:
  pg-endpoint-storage-key:
  # Endpoint storage's local folder (without the `rustfs` profile).
  pg-endpoint-storage:
  upgrade-snapshots:
  # The `authz` profile: OpenFGA's SQLite store, and the store and model ids openfga-init
  # records for the engine.
  openfga-data:
  authz:
