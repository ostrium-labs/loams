# Open-protocol compute on Loams, opt in (design 68 §12, design 74 §14; OC1
# OC0 Task 2 and DX1 DX0 Task 1): the stock Temporal server, the DBOS test
# runners and Apache Airflow with the Edge executor, each on Loams Postgres;
# and the Loams Temporal gateway (profile `temporal-gateway`, DX1 Task 10).
# An override of compose.yaml, with the pins of conformance/compute/pins.env:
#
#   docker compose --env-file .env --env-file ../../conformance/compute/pins.env \
#     -f compose.yaml -f compose.compute.yaml --profile temporal up -d
#
# (conformance/compute/lib.sh's `oc_up <profile>` runs exactly this.)
#
# - Every service here has a profile (`temporal`, `dbos`, `airflow`,
#   `temporal-gateway`), so
#   nothing starts without one, and no service publishes a host port: the
#   products reach Loams, and each other, on the compose network only.
# - The database is Loams Postgres through the **direct** endpoint (DX1
#   ruling R0.7): the included stack's `compute1` on `compute1:55433` unless
#   LOAMS_PG_HOST and LOAMS_PG_PORT name another (a `pg-control` endpoint's
#   `ep-<ulid>`). There is no session-pooled endpoint yet (#1129), and
#   Temporal, DBOS and Airflow's scheduler need a session: multi-statement
#   transactions with row locks, LISTEN/NOTIFY, advisory locks.
# - Never Loams SQL: these products keep their state in Postgres only.
# - Each product has its own database and role, created by the one-shot
#   `compute-init` (compute/durable-init.sh, DX0 Task 2; Temporal's schema by
#   `temporal-schema`). The
#   credentials below are defaults for a test stack on the compose network;
#   set them in .env for anything else.
# - Images are pinned by digest in pins.env; the ${VAR:?} forms fail fast
#   when that file is not passed. The one exception is `temporal-gateway`'s,
#   a Loams release image tagged with LOAMS_VERSION like compose.yaml's own.

# The Temporal server (MIT), four services from the stock image, compat mode
# (D1509). Its config is the image's own template, filled from these
# variables; the dynamic config is compute/temporal/development-sql.yaml. The
# shard count is fixed when the database is created and never changes.
x-temporal: &temporal
  profiles: [temporal]
  image: ${TEMPORAL_SERVER_IMAGE:?pass conformance/compute/pins.env with --env-file}
  restart: unless-stopped
  environment: &temporal-env
    DB: postgres12
    DB_PORT: ${LOAMS_PG_PORT:-55433}
    POSTGRES_SEEDS: ${LOAMS_PG_HOST:-compute1}
    POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
    POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
    DBNAME: temporal
    VISIBILITY_DBNAME: temporal_visibility
    NUM_HISTORY_SHARDS: "16"
    BIND_ON_IP: 0.0.0.0
    DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
    LOG_LEVEL: ${TEMPORAL_LOG_LEVEL:-warn}
  volumes:
    - ./compute/temporal/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
  depends_on:
    temporal-schema:
      condition: service_completed_successfully
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-init-env: &init-env
  LOAMS_PG_HOST: ${LOAMS_PG_HOST:-compute1}
  LOAMS_PG_PORT: ${LOAMS_PG_PORT:-55433}
  TEMPORAL_DB_USER: ${TEMPORAL_DB_USER:-temporal}
  TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
  AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
  AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
  DBOS_DB_USER: ${DBOS_DB_USER:-postgres}
  DBOS_DB_PASSWORD: ${DBOS_DB_PASSWORD:-dbos}
  LOAMS_TEMPORAL_DB_USER: ${LOAMS_TEMPORAL_DB_USER:-loams_temporal}
  LOAMS_TEMPORAL_DB_PASSWORD: ${LOAMS_TEMPORAL_DB_PASSWORD:-loams_temporal}

services:
  # One-shot (DX0 Task 2): the roles and databases of every compute profile
  # on Loams Postgres, idempotent (compute/durable-init.sh `roles`). As the
  # admin role of the direct endpoint: compute1's cloud_admin by default.
  compute-init:
    profiles: [temporal, dbos, airflow, temporal-gateway]
    image: ${PSQL_IMAGE:?pass conformance/compute/pins.env with --env-file}
    restart: "no"
    entrypoint: ["/bin/sh", "/compute/durable-init.sh", "roles"]
    environment:
      <<: *init-env
      LOAMS_PG_ADMIN_USER: ${LOAMS_PG_ADMIN_USER:-cloud_admin}
      LOAMS_PG_ADMIN_PASSWORD: ${LOAMS_PG_ADMIN_PASSWORD:-cloud_admin}
    volumes:
      - ./compute/durable-init.sh:/compute/durable-init.sh:ro
    depends_on:
      compute1:
        condition: service_started
        required: false
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # One-shot: Temporal's schema in temporal and temporal_visibility with the
  # pinned admin-tools' temporal-sql-tool (compute/durable-init.sh
  # `temporal-schema`).
  temporal-schema:
    profiles: [temporal]
    image: ${TEMPORAL_ADMIN_TOOLS_IMAGE:?pass conformance/compute/pins.env with --env-file}
    restart: "no"
    entrypoint: ["/bin/sh", "/compute/durable-init.sh", "temporal-schema"]
    environment: *init-env
    volumes:
      - ./compute/durable-init.sh:/compute/durable-init.sh:ro
    depends_on:
      compute-init:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  temporal-frontend:
    <<: *temporal
    environment:
      <<: *temporal-env
      TEMPORAL_SERVICES: frontend
    # No healthcheck: the image carries no client. `oc_temporal_wait` asks
    # the frontend with the admin-tools image's CLI instead.
  temporal-history:
    <<: *temporal
    environment:
      <<: *temporal-env
      TEMPORAL_SERVICES: history
  temporal-matching:
    <<: *temporal
    environment:
      <<: *temporal-env
      TEMPORAL_SERVICES: matching
  temporal-worker:
    <<: *temporal
    environment:
      <<: *temporal-env
      TEMPORAL_SERVICES: worker
      PUBLIC_FRONTEND_ADDRESS: temporal-frontend:7233

  # The DBOS Transact test runners (MIT): idle toolchain containers that
  # conformance/compute/dbos-<lang>/run.sh executes the SDK's own suite in.
  # The suites hard-code localhost:5432 (DX1 ruling R0.12), so the runners
  # share `dbos-pg`'s network namespace, where socat forwards that port to
  # Loams Postgres (DBOS_PG_TARGET; the transaction-mode leg points it at
  # PgDog instead).
  dbos-pg:
    profiles: [dbos]
    image: ${SOCAT_IMAGE:?pass conformance/compute/pins.env with --env-file}
    restart: unless-stopped
    command:
      - TCP-LISTEN:5432,fork,reuseaddr,bind=127.0.0.1
      - TCP:${DBOS_PG_TARGET:-compute1:55433}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
  dbos-py:
    profiles: [dbos]
    image: ${PYTHON_IMAGE:?pass conformance/compute/pins.env with --env-file}
    network_mode: service:dbos-pg
    command: ["sleep", "infinity"]
    environment: &dbos-env
      PGPASSWORD: ${DBOS_DB_PASSWORD:-dbos}
      DB_PASSWORD: ${DBOS_DB_PASSWORD:-dbos}
      DBOS_DATABASE: POSTGRES
    volumes:
      - dbos-work:/work
    depends_on: &dbos-deps
      dbos-pg:
        condition: service_started
      compute-init:
        condition: service_completed_successfully
  dbos-ts:
    profiles: [dbos]
    image: ${NODE_IMAGE:?pass conformance/compute/pins.env with --env-file}
    network_mode: service:dbos-pg
    command: ["sleep", "infinity"]
    environment: *dbos-env
    volumes:
      - dbos-work:/work
    depends_on: *dbos-deps
  dbos-go:
    profiles: [dbos]
    image: ${GO_IMAGE:?pass conformance/compute/pins.env with --env-file}
    network_mode: service:dbos-pg
    command: ["sleep", "infinity"]
    environment: *dbos-env
    volumes:
      - dbos-work:/work
    depends_on: *dbos-deps
  dbos-java:
    profiles: [dbos]
    image: ${JAVA_IMAGE:?pass conformance/compute/pins.env with --env-file}
    network_mode: service:dbos-pg
    command: ["sleep", "infinity"]
    environment: *dbos-env
    volumes:
      - dbos-work:/work
    depends_on: *dbos-deps

  # Apache Airflow 3.3 (Apache-2.0) with the Edge executor (AIP-69, provider
  # `edge3`), two schedulers and two edge workers (design 68 §4.3, design 74
  # §9.2). The stock image does not carry `edge3`, so each container installs
  # the pinned version with the release's constraints at start
  # (_PIP_ADDITIONAL_REQUIREMENTS, which Airflow documents for test stacks
  # like this one; DX1 ruling T1.R2). DAGs come from AIRFLOW_DAGS_DIR (the
  # default LocalDagBundle); a GitDagBundle is set with
  # AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST (conformance/compute/airflow/
  # compose.test.yaml shows one).
  #
  # The profile needs a bucket: RustFS of the `rustfs` profile by default, or
  # any S3 endpoint in AIRFLOW_S3_ENDPOINT. Task logs go there once a task
  # ends (remote logging), and so do XComs above AIRFLOW_XCOM_THRESHOLD bytes
  # (XComObjectStorageBackend), so neither is lost with a worker. The
  # one-shot `airflow-init` creates the buckets and runs `airflow db migrate`
  # (compute/airflow/airflow-init.sh) before anything else starts.
  airflow-init:
    <<: &airflow
      profiles: [airflow]
      image: ${AIRFLOW_IMAGE:?pass conformance/compute/pins.env with --env-file}
      restart: unless-stopped
      environment: &airflow-env
        # edge3, and s3fs for the s3:// ObjectStoragePath of the XCom backend
        # (not in the image's extras; the constraints pin its version; T6.R12).
        _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-edge3==${AIRFLOW_EDGE3:?pass conformance/compute/pins.env with --env-file} s3fs
        PIP_CONSTRAINT: ${AIRFLOW_CONSTRAINTS:?pass conformance/compute/pins.env with --env-file}
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@${LOAMS_PG_HOST:-compute1}:${LOAMS_PG_PORT:-55433}/airflow
        AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-airflow.providers.edge3.executors.EdgeExecutor}
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
        AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
        AIRFLOW__API__BASE_URL: http://airflow-api-server:8080
        AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-loams-compute-test-only-jwt-secret}
        AIRFLOW__EDGE__API_ENABLED: "true"
        AIRFLOW__EDGE__API_URL: http://airflow-api-server:8080/edge_worker/v1/rpcapi
        AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
        # HA schedulers lock rows (SELECT ... FOR UPDATE SKIP LOCKED); the default, stated.
        AIRFLOW__SCHEDULER__USE_ROW_LEVEL_LOCKING: "true"
        # The bucket: remote task logs and object-storage XComs.
        AIRFLOW_CONN_LOAMS_S3: '{"conn_type": "aws", "login": "${RUSTFS_ACCESS_KEY:-rustfsadmin}", "password": "${RUSTFS_SECRET_KEY:-rustfsadmin}", "extra": {"endpoint_url": "${AIRFLOW_S3_ENDPOINT:-http://rustfs:9000}", "region_name": "us-east-1"}}'
        AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
        AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: loams_s3
        AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://airflow-logs/logs
        AIRFLOW__CORE__XCOM_BACKEND: airflow.providers.common.io.xcom.backend.XComObjectStorageBackend
        AIRFLOW__COMMON_IO__XCOM_OBJECTSTORAGE_PATH: s3://loams_s3@airflow-xcom/xcom
        AIRFLOW__COMMON_IO__XCOM_OBJECTSTORAGE_THRESHOLD: ${AIRFLOW_XCOM_THRESHOLD:-1024}
      volumes:
        - ${AIRFLOW_DAGS_DIR:-./compute/airflow/dags}:/opt/airflow/dags:ro
        - ./compute/airflow/airflow-init.sh:/compute/airflow/airflow-init.sh:ro
      depends_on: &airflow-deps
        airflow-init:
          condition: service_completed_successfully
      cap_drop: [ALL]
      security_opt:
        - no-new-privileges:true
    restart: "no"
    command: ["bash", "/compute/airflow/airflow-init.sh"]
    depends_on:
      compute-init:
        condition: service_completed_successfully
      rustfs:
        condition: service_started
        required: false
  airflow-api-server:
    <<: *airflow
    command: ["api-server"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v2/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
  airflow-scheduler-1:
    <<: *airflow
    command: ["scheduler"]
  airflow-scheduler-2:
    <<: *airflow
    command: ["scheduler"]
  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
  airflow-triggerer:
    <<: *airflow
    command: ["triggerer"]
  # The edge workers reach only the API server (Airflow 3: a task talks to
  # the Execution API, never the database). They keep the shared settings
  # but skip the image entrypoint's database check, so a worker starts
  # without a route to Loams Postgres (as it would on a remote host).
  airflow-edge-worker-1:
    <<: *airflow
    command: ["edge", "worker", "--edge-hostname", "edge-worker-1", "--queues", "default"]
    environment:
      <<: *airflow-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    depends_on:
      <<: *airflow-deps
      airflow-api-server:
        condition: service_healthy
  airflow-edge-worker-2:
    <<: *airflow
    command: ["edge", "worker", "--edge-hostname", "edge-worker-2", "--queues", "default"]
    environment:
      <<: *airflow-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    depends_on:
      <<: *airflow-deps
      airflow-api-server:
        condition: service_healthy

  # The Loams Temporal gateway (design 74; plan DX1 Task 10; D2030, D2031),
  # preview: the release image ghcr.io/ostrium-labs/loams-temporal, which
  # speaks the DX1 subset of the Temporal API (the matrix in
  # docs/guides/durable/temporal-gateway.md).
  #
  #   cp temporal-gateway.toml.example temporal-gateway.toml   # keys, namespace
  #   docker compose --env-file .env --env-file ../../conformance/compute/pins.env \
  #     -f compose.yaml -f compose.compute.yaml --profile temporal-gateway up -d
  #
  # - In the engine's network namespace (`network_mode: service:loams`): it
  #   reaches the engine's Resonate on 127.0.0.1:8001 (the durable listener,
  #   loopback only until D111 gives it auth) and listens on 0.0.0.0:7233 of
  #   that namespace, so SDKs on the compose network dial `loams:7233`. No
  #   host port.
  # - Its own database, `loams_temporal`, owned by role `loams_temporal`, made
  #   by `compute-init` on the direct endpoint (never PgDog transaction mode,
  #   §74 §5.5 rule 5; never Loams SQL, D1502). The gateway migrates its own
  #   schema at start.
  # - API keys (`[[keys]]`) and the task-token key come from the config and
  #   LOAMS_TEMPORAL_TOKEN_KEY_1 (32 bytes or more; the gateway refuses an
  #   empty or short one). LOAMS_TEMPORAL_CONFIG names another config file.
  temporal-gateway:
    profiles: [temporal-gateway]
    image: ${LOAMS_TEMPORAL_IMAGE:-${LOAMS_REGISTRY:-ghcr.io/ostrium-labs}/loams-temporal:${LOAMS_VERSION:-0.1.4}}
    restart: unless-stopped
    network_mode: service:loams
    environment:
      RUST_LOG: ${LOAMS_TEMPORAL_LOG:-info}
      LOAMS_TEMPORAL_DATABASE_URL: postgresql://${LOAMS_TEMPORAL_DB_USER:-loams_temporal}:${LOAMS_TEMPORAL_DB_PASSWORD:-loams_temporal}@${LOAMS_PG_HOST:-compute1}:${LOAMS_PG_PORT:-55433}/loams_temporal
      LOAMS_TEMPORAL_TOKEN_KEY_1: ${LOAMS_TEMPORAL_TOKEN_KEY_1:-}
    volumes:
      - type: bind
        source: ${LOAMS_TEMPORAL_CONFIG:-./temporal-gateway.toml}
        target: /etc/loams-temporal/gateway.toml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      loams:
        condition: service_healthy
      compute-init:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  # The DBOS runners' scratch space: the SDK sources at the pinned tags and
  # their caches. Nothing in it is kept between runs on purpose.
  dbos-work:
