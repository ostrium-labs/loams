# Compose: the Spark Connect proxy in front of Apache Spark 4.1.3 (profile
# `spark-jvm`, compose.spark.yaml), on 127.0.0.1:15003. Sail is behind
# engine-gateway on 15002 (engines/gateway.toml). The key is the same
# ENGINE_GATEWAY_KEY: the service writes its `<namespace> <sha256>` line at
# start. A key of namespace `default` is its grant (single tenant, R3/R9).
listen = "0.0.0.0:15002"
namespace_keys_file = "/run/spark-proxy/keys"

[authz]
kind = "key_grants"

[limits]
max_sessions = 8
max_operations = 16
idle_timeout = 1800
instance_idle_timeout = 900

[[routes]]
namespace = "default"
instance = "spark"
uri = "http://spark-connect:15002"
# The server checks this pre-shared token (Spark 4 `spark.connect.authenticate.token`).
token_env = "SPARK_CONNECT_AUTHENTICATE_TOKEN"
