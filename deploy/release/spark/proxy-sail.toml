# Compose: the Spark Connect proxy in front of Sail (compose.spark.yaml).
# Keys come from keys.json (`loams-spark-proxy mint-key`); a key of namespace
# `local` is its grant (authz = key_grants: compose is single tenant, R3/R9).
listen = "0.0.0.0:15002"
keys_file = "/etc/loams-spark-proxy/keys.json"

[authz]
kind = "key_grants"

[limits]
max_sessions = 8
max_operations = 16
idle_timeout = 1800
instance_idle_timeout = 900

[[routes]]
namespace = "local"
instance = "spark"
uri = "http://sail:50051"
