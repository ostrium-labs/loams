artifact = "iceberg-aws-bundle"
version = "1.12.0"
sha256 = "dd7e49ffa4ac9b215bed846581991259e3aec9bb2fa08d6cec029c46cd66d957"
license = "Apache-2.0"
purpose = "S3FileIO for Loams object storage"

