# The Flink connector-jar bundle for Loams' managed Flink SQL (design 81,
# D1986). Preview.
#
# Every jar is fetched from Maven Central at the pinned version and checked
# against the sha256 below (computed 2026-10-27 by streaming each jar and
# cross-checked against Maven Central's published sha1). Containerfile
# layers them onto the official Flink image; crates/loams-flink keeps a copy
# of this list (connectors::jars::BUNDLE) and a unit test checks the two are
# equal, so change both in one commit.
#
# Every version is at least 14 days old on the day it was pinned. Licences:
# Apache-2.0 except the PostgreSQL JDBC driver (BSD-2-Clause).

[flink]
version = "2.2.1"
# docker.io/library/flink:2.2.1-scala_2.12-java21, the manifest list's digest.
image = "docker.io/library/flink:2.2.1-scala_2.12-java21@sha256:521951efbfbb0cec74c2826446ce1d20a051bff18e6d3716a6affe97ddec692a"
# Bumped whenever a jar changes; the image tag is <flink>-loams<bundle>.
bundle = 1

[[jar]]
group = "org.apache.iceberg"
artifact = "iceberg-flink-runtime-2.2"
version = "1.12.0"
sha256 = "c79bbee8792b1115c321e4be99fab3fb36db0bf8fa2bba24b481e6da14416de3"
license = "Apache-2.0"
purpose = "Iceberg catalog and table connector (REST catalog on Lakekeeper)"

