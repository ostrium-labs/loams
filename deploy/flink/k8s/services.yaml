apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: jobmanager
  ports:
    - {name: rpc, port: 6123, targetPort: 6123}
    - {name: blob, port: 6124, targetPort: 6124}
    - {name: rest, port: 8081, targetPort: 8081}
---
apiVersion: v1
kind: Service
metadata:
  name: flink-taskmanager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: taskmanager
  ports:
    - {name: rpc, port: 6122, targetPort: 6122}
---
apiVersion: v1
kind: Service
metadata:
  name: flink-sql-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: sql-gateway
  ports:
    - {name: sql, port: 8083, targetPort: 8083}
