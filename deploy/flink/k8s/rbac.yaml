# Kubernetes HA (D1974): leader election and job metadata on ConfigMaps.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-ha
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get, list, watch, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-ha
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink-ha
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: loams-flink-example
