apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  labels:
    {{- include "loams-risingwave.instanceSelector" . | nindent 4 }}
    app.kubernetes.io/managed-by: loams
type: Opaque
data:
  {{- range $k, $v := .Values.credentials }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
