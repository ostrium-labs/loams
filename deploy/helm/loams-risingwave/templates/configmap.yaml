apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configName }}
  labels:
    {{- include "loams-risingwave.instanceSelector" . | nindent 4 }}
    app.kubernetes.io/managed-by: loams
data:
  risingwave.toml: |
    {{- .Values.config | nindent 4 }}
  # Read by meta nodes through RW_LICENSE_KEY_PATH. Always empty: RisingWave's
  # free tier, with `ALTER SYSTEM SET license_key` refused (D1901). Not a
  # value on purpose.
  license.key: ""
