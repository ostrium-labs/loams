apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: storagebindings.loams.dev
spec:
  group: loams.dev
  names:
    categories: []
    kind: StorageBinding
    plural: storagebindings
    shortNames:
    - sb
    singular: storagebinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.summary
      name: Summary
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for StorageBindingSpec via `CustomResource`
        properties:
          spec:
            description: A named storage system.
            properties:
              credentials:
                default: {}
                description: Credentials; references only.
                properties:
                  secretRef:
                    description: |-
                      A reference to a Secret in the same namespace. It names the Secret and
                      optionally the key inside it; it never holds a value.
                    nullable: true
                    properties:
                      key:
                        description: |-
                          The key inside the Secret. Each user of a reference states its
                          default (for a database reference, `dsn`).
                        nullable: true
                        type: string
                      name:
                        description: The Secret's name.
                        type: string
                    required:
                    - name
                    type: object
                  workloadIdentity:
                    description: 'Cloud workload identity: no key is stored anywhere.'
                    nullable: true
                    properties:
                      awsRoleArn:
                        description: AWS IAM role ARN (IRSA).
                        nullable: true
                        type: string
                      azureClientId:
                        description: Azure client id (Azure Workload Identity).
                        nullable: true
                        type: string
                      gcpServiceAccount:
                        description: GCP service account email (GKE Workload Identity).
                        nullable: true
                        type: string
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set only one of workloadIdentity and secretRef
                  rule: '!(has(self.workloadIdentity) && has(self.secretRef))'
              kafka:
                description: A Kafka-compatible cluster. Type only; no controller uses it yet.
                nullable: true
                properties:
                  bootstrapServers:
                    items:
                      type: string
                    type: array
                required:
                - bootstrapServers
                type: object
              kind:
                description: The storage kind. Cannot change after creation.
                enum:
                - object
                - sql-mysql
                - sql-postgres
                - kafka
                - kv
                type: string
                x-kubernetes-validations:
                - message: kind is immutable
                  rule: self == oldSelf
              kv:
                description: A key-value store. Type only; no controller uses it yet.
                nullable: true
                properties:
                  endpoint:
                    type: string
                required:
                - endpoint
                type: object
              object:
                description: An object store bucket.
                nullable: true
                properties:
                  bucket:
                    type: string
                  endpoint:
                    description: Endpoint URL for S3-compatible stores.
                    nullable: true
                    type: string
                  prefix:
                    description: Key prefix inside the bucket.
                    nullable: true
                    type: string
                  provider:
                    description: The object store provider.
                    enum:
                    - s3
                    - gcs
                    - azure
                    - r2
                    type: string
                  region:
                    nullable: true
                    type: string
                required:
                - bucket
                - provider
                type: object
              sqlMysql:
                description: A MySQL-compatible database. Type only; no controller uses it yet.
                nullable: true
                properties:
                  database:
                    nullable: true
                    type: string
                  host:
                    type: string
                  port:
                    format: uint16
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                required:
                - host
                type: object
              sqlPostgres:
                description: A Postgres database. Type only; no controller uses it yet.
                nullable: true
                properties:
                  database:
                    nullable: true
                    type: string
                  host:
                    type: string
                  port:
                    format: uint16
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                required:
                - host
                type: object
            required:
            - kind
            type: object
            x-kubernetes-validations:
            - message: kind object needs an object block
              rule: self.kind != 'object' || has(self.object)
          status:
            description: Observed state of a `StorageBinding`.
            nullable: true
            properties:
              capabilities:
                description: Capabilities the probe found (object kind only).
                nullable: true
                properties:
                  conditionalPut:
                    type: boolean
                  multipart:
                    type: boolean
                  rangeRead:
                    type: boolean
                required:
                - conditionalPut
                - multipart
                - rangeRead
                type: object
              conditions:
                default: []
                description: Conditions; `Ready` is the one to wait for.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: The spec generation the conditions describe.
                format: int64
                nullable: true
                type: integer
              operation:
                description: The journal of the operation in progress.
                nullable: true
                properties:
                  done:
                    default: []
                    description: The plan items already done.
                    items:
                      type: string
                    type: array
                  fence:
                    default: 0
                    description: Fence token of the leader that wrote this journal.
                    format: int32
                    type: integer
                  id:
                    description: Operation id, stable across restarts.
                    type: string
                  kind:
                    description: Operation kind (for example `install`, `upgrade`, `delete`).
                    type: string
                  plan:
                    default: []
                    description: The ordered plan items.
                    items:
                      type: string
                    type: array
                  step:
                    description: The step in progress, if any.
                    nullable: true
                    properties:
                      item:
                        description: The plan item being run.
                        type: string
                      phase:
                        description: The phase inside the item (for example `prepare`, `apply`, `verify`).
                        type: string
                      since:
                        description: When the step started.
                        format: date-time
                        type: string
                    required:
                    - item
                    - phase
                    - since
                    type: object
                required:
                - id
                - kind
                type: object
              summary:
                description: A one-line summary for `kubectl get`.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: StorageBinding
        type: object
    served: true
    storage: true
    subresources:
      status: {}
