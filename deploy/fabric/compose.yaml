# The real-system test estate for Loams Flow's connectors (CN2 plan Task 6,
# owner rulings OR-2 and OR-3). FL1 owns the rest of this file (the Fabric
# itself and CN1's `connectors` profile for the ★ suites); CN2 adds two
# profiles here and nothing in the default profile:
#
#   connectors-p2       open images (Apache, MIT, BSD, MPL, EPL, GPL, PostgreSQL)
#   connectors-ci-only  `ci-service` images: proprietary, source-available or
#                       under a EULA (OR-3). CI only; never in an image Loams
#                       builds and never in the default profile.
#
#   docker compose -f deploy/fabric/compose.yaml --profile connectors-p2 up -d --wait rabbitmq
#   LOAMS_CONNECTORS_P2_STACK=1 cargo test -p loams-connector-brokers
#
# Every image is pinned by digest, at the newest tag of the line
# `docs/plans/cn2-dependency-spike.md` §7 names that was pushed on or before
# 2026-09-29 (the 14-day rule on 2026-10-13); the plan's ruling R6.6 lists
# where that differs from the spike's tag. Each service carries its licence
# (`io.loams.licence`, SPDX) and whether it is a `ci-service`
# (`io.loams.ci-service`); `loams-flow-conformance`'s
# `compose_estate_is_pinned_and_split` checks both against OR-3.
#
# The credentials below are fixed test values for throwaway containers on a
# CI runner, never a secret of any real account; real accounts are reached
# only by the scheduled `connectors-nightly` job through repository secrets.
# Host ports are distinct so any set of services can run side by side.

name: loams-fabric

services:
  # ------------------------------------------------------ connectors-p2 --

  rabbitmq:
    image: rabbitmq:4.3.5-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631
    profiles: [connectors-p2]
    labels: { io.loams.licence: "MPL-2.0", io.loams.ci-service: "false" }
    # RabbitMQ's `guest` user may log in from loopback only, and the suites
    # connect through the published port (CN2 Task 18, R18.10).
    environment:
      RABBITMQ_DEFAULT_USER: loams
      RABBITMQ_DEFAULT_PASS: loams-test
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  artemis:
    image: apache/artemis:2.57.0@sha256:0f32b054e1f4adc45fc64824ebb0586579ffd563ce37d75b5a10d27db19a3889
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    environment:
      ARTEMIS_USER: loams
      ARTEMIS_PASSWORD: loams-test
    ports: ["61616:61616", "5673:5672"]

  activemq:
    image: apache/activemq:6.3.2@sha256:fb98e5b8bc1ecc67ad19b0b982c00575fa12d54866f3cde9fa5b0ec1241631c2
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    # The 6.x image ships its AMQP connector commented out (only OpenWire
    # listens), so 5672 reset every connection: enable it before starting.
    entrypoint:
      - /bin/bash
      - -c
      - |
        sed -i 's|<!-- \(<transportConnector name="amqp"[^>]*/>\) -->|\1|' "$$ACTIVEMQ_HOME/conf/activemq.xml"
        exec /usr/local/bin/entrypoint.sh activemq console
    ports: ["61617:61616", "5674:5672"]
    # Ready once the AMQP port accepts connections.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 2s
      retries: 60

  nats:
    image: nats:2.15.0@sha256:cd3fcd4ecdda44e3a66728a5334af0a959bc3979b32810e033d1c547241cd0f4
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  mosquitto:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    profiles: [connectors-p2]
    labels: { io.loams.licence: "EPL-2.0 OR BSD-3-Clause", io.loams.ci-service: "false" }
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports: ["1883:1883"]

  pulsar:
    image: apachepulsar/pulsar:4.0.13@sha256:f923d4ccad4c79b5de9a2c88f47f73c8128223e8e11a95a3cbd81229c4f4dd9e
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    command: ["bin/pulsar", "standalone"]
    ports: ["6650:6650", "8081:8080"]
    # Standalone opens its ports well before the broker serves topics, so
    # `up --wait` waits for the admin health check (CN2 Task 18).
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 30s

  # SQS, SNS, EventBridge, Kinesis, DynamoDB (+ Streams), Lambda and SES
  # (D60, R0.23). Lambda runs functions in real containers, hence the socket.
  floci:
    image: floci/floci:2.1.0@sha256:f5aa8c18302cedb4f2385f5c4e455b3efc77fee6bf7b6e5d1712b2817ba102db
    profiles: [connectors-p2]
    labels: { io.loams.licence: "MIT", io.loams.ci-service: "false" }
    ports: ["4566:4566"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # PostgreSQL 17 with pgvector, logical replication on (Task 10's CDC).
  pgvector:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    profiles: [connectors-p2]
    labels: { io.loams.licence: "PostgreSQL", io.loams.ci-service: "false" }
    environment:
      POSTGRES_PASSWORD: loams-test
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=16", "-c", "max_wal_senders=16"]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    profiles: [connectors-p2]
    labels: { io.loams.licence: "GPL-2.0-only WITH Universal-FOSS-exception-1.0", io.loams.ci-service: "false" }
    environment:
      MYSQL_ROOT_PASSWORD: loams-test
    command: ["--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--binlog-row-metadata=FULL"]
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ploams-test"]
      interval: 2s
      retries: 60

  mariadb:
    image: mariadb:11.8.8@sha256:24e76fcec8c003a0362d0dd53f4806e7e79458d7fdeaf47437760e19496f5a9c
    profiles: [connectors-p2]
    labels: { io.loams.licence: "GPL-2.0-only", io.loams.ci-service: "false" }
    environment:
      MARIADB_ROOT_PASSWORD: loams-test
    command: ["--log-bin=mariadb-bin", "--binlog-format=ROW", "--binlog-row-metadata=FULL", "--server-id=1"]
    ports: ["3308:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  cassandra:
    image: cassandra:5.0.8@sha256:259578bbeac315a7326c2a99e60eab86f3415e9e895207bf2a032af4de8c16b5
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
    ports: ["9042:9042"]
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 5s
      retries: 60

  valkey:
    image: valkey/valkey:8.1.10@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
    profiles: [connectors-p2]
    labels: { io.loams.licence: "BSD-3-Clause", io.loams.ci-service: "false" }
    ports: ["6380:6379"]

  opensearch:
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9201:9200"]
    # The search family's suites (CN2 Task 15) start once the cluster is up.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 5s
      retries: 60

  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    # An API key, so the `auth` suite proves the `key` method and that an
    # unauthenticated write is refused (CN2 Task 15). A fixed test value.
    environment:
      QDRANT__SERVICE__API_KEY: loams-test-key
    ports: ["6333:6333", "6334:6334"]

  trino:
    image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    ports: ["8080:8080"]

  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    environment:
      RUSTFS_ACCESS_KEY: loams
      RUSTFS_SECRET_KEY: loams-test-secret
    ports: ["9000:9000", "9001:9001"]

  fake-gcs:
    image: fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
    profiles: [connectors-p2]
    labels: { io.loams.licence: "BSD-2-Clause", io.loams.ci-service: "false" }
    # The XML API's routes match only when the request's Host is the public
    # host, and the suites (scripts/connectors/objects_stack.sh) call
    # 127.0.0.1:4443.
    command: ["-scheme", "http", "-port", "4443", "-public-host", "127.0.0.1:4443"]
    ports: ["4443:4443"]

  # Blob, Queue and Table; no hierarchical namespace (R0.21). Also the Event
  # Hubs emulator's storage, hence both profiles.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    profiles: [connectors-p2, connectors-ci-only]
    labels: { io.loams.licence: "MIT", io.loams.ci-service: "false" }
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--skipApiVersionCheck"]
    ports: ["10000:10000", "10001:10001", "10002:10002"]

  # `atmoz/sftp` publishes only the moving `alpine` tag (R6.6).
  sftp:
    image: atmoz/sftp:alpine@sha256:7e439fabeae536fa254340724c042e11999924d906417dbb5c73602ad518813f
    profiles: [connectors-p2]
    labels: { io.loams.licence: "MIT", io.loams.ci-service: "false" }
    command: ["loams:loams-test:1001::upload"]
    ports: ["2222:22"]

  neo4j:
    image: neo4j:5.26.30-community@sha256:3388e05ee53c8313d01acdf33e63ad175af95a92226dc8551160564439ce2c8c
    profiles: [connectors-p2]
    labels: { io.loams.licence: "GPL-3.0-only", io.loams.ci-service: "false" }
    environment:
      NEO4J_AUTH: neo4j/loams-test-pass
    ports: ["7474:7474", "7687:7687"]

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    # CN2 Task 21 (R21.7): scrape itself and remote-write to the receiver the
    # connector's test serves on the runner.
    volumes:
      - ./emulators/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9090:9090"]

  # Vault's API, open licence (the `vault` manifest's system).
  openbao:
    image: openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
    profiles: [connectors-p2]
    labels: { io.loams.licence: "MPL-2.0", io.loams.ci-service: "false" }
    command: ["server", "-dev", "-dev-root-token-id=loams-dev-root", "-dev-listen-address=0.0.0.0:8200"]
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: loams-test
      # A bootstrap service-account client for the keycloak profile's
      # client-credentials grant (CN2 Task 20); throwaway CI values.
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: loams-ci
      KC_BOOTSTRAP_ADMIN_CLIENT_SECRET: loams-test
      # /health/ready on the management port (9000, not published), so
      # `up --wait` returns once Keycloak serves, not when its container starts
      # (start-dev spends its first ~30 s building). The image has no curl.
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    ports: ["8180:8080"]

  kestra:
    image: kestra/kestra:v2.0.4@sha256:3db5e0110babe75bdf6d9e5f030e1df9f7da2a148c47b5197ba233f3f0d6e8f5
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    command: ["server", "local"]
    ports: ["8082:8080"]

  stripe-mock:
    image: stripe/stripe-mock:v0.205.0@sha256:ff32647993847be491e68533e2881c90434fa8d5df40246ee5f7d41253422081
    profiles: [connectors-p2]
    labels: { io.loams.licence: "MIT", io.loams.ci-service: "false" }
    ports: ["12111:12111", "12112:12112"]

  # Apache Kafka 4.3.1, single-node KRaft, transactions on: the Kafka-protocol
  # family's own suites (CN2 Task 9, OR-2). Published on 9092; the Event Hubs
  # emulator also publishes 9092, and the two never run in the same shard.
  kafka:
    image: apache/kafka:4.3.1@sha256:ccd1314e47ec76909e01f86308b4dcf2064f19f7c89759234322314b0e319e26
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # The same Apache Kafka 4.3.1 with a SASL_SSL listener (PLAIN users, a test
  # CA): the Kafka family's SASL_SSL leg, the shape a Confluent Cloud cluster
  # has (CC1 Task 2, D1822; `tests/kafka_sasl.rs`). At each start the
  # container makes a throwaway CA and a server certificate for localhost and
  # 127.0.0.1; the server key never leaves it, and the CA certificate (public)
  # is written to deploy/fabric/kafka-sasl/ca.pem (git-ignored) for the
  # suite, owned by that directory's owner. The users and passwords are fixed
  # test values, not secrets. SASL_SSL on 9094; a plaintext listener on 9095
  # serves only the inter-broker traffic and the health check.
  kafka-sasl:
    image: apache/kafka:4.3.1@sha256:ccd1314e47ec76909e01f86308b4dcf2064f19f7c89759234322314b0e319e26
    profiles: [connectors-p2]
    labels: { io.loams.licence: "Apache-2.0", io.loams.ci-service: "false" }
    # Root, to write ca.pem into a bind mount whatever its owner (it is then
    # chowned to the directory's owner).
    user: "0:0"
    ports: ["9094:9094"]
    volumes: ["./kafka-sasl:/tls"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        w=/var/lib/kafka-sasl
        rm -rf "$$w" && mkdir -p "$$w/data" && cd "$$w"
        openssl req -x509 -nodes -newkey rsa:2048 -days 30 -subj "/CN=loams-test-ca" \
          -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" \
          -keyout ca.key -out ca.pem 2>/dev/null
        openssl req -nodes -newkey rsa:2048 -subj "/CN=localhost" -keyout server.key -out server.csr 2>/dev/null
        printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nkeyUsage=critical,digitalSignature,keyEncipherment\n' > ext
        openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 30 \
          -extfile ext -out server.pem 2>/dev/null
        cat server.key server.pem > keystore.pem
        rm -f ca.key server.csr
        cp ca.pem /tls/ca.pem.tmp && mv /tls/ca.pem.tmp /tls/ca.pem
        chown "$$(stat -c %u:%g /tls)" /tls/ca.pem && chmod 0644 /tls/ca.pem
        cat > server.properties <<'PROPS'
        node.id=1
        process.roles=broker,controller
        controller.quorum.voters=1@localhost:9093
        controller.listener.names=CONTROLLER
        listeners=SASL_SSL://:9094,INTERNAL://:9095,CONTROLLER://:9093
        advertised.listeners=SASL_SSL://localhost:9094,INTERNAL://localhost:9095
        listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,SASL_SSL:SASL_SSL
        inter.broker.listener.name=INTERNAL
        sasl.enabled.mechanisms=PLAIN
        listener.name.sasl_ssl.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_loams-test="loams-test-password";
        ssl.keystore.type=PEM
        ssl.keystore.location=/var/lib/kafka-sasl/keystore.pem
        log.dirs=/var/lib/kafka-sasl/data
        offsets.topic.replication.factor=1
        transaction.state.log.replication.factor=1
        transaction.state.log.min.isr=1
        group.initial.rebalance.delay.ms=0
        PROPS
        /opt/kafka/bin/kafka-storage.sh format -t "$$(/opt/kafka/bin/kafka-storage.sh random-uuid)" -c server.properties >/dev/null
        exec /opt/kafka/bin/kafka-server-start.sh server.properties
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9095 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ------------------------------------------- connectors-ci-only (OR-3) --

  redpanda:
    image: redpandadata/redpanda:v26.2.3@sha256:9e83cfa99278f30d0133271c26bf670cd69c94ffa6ba0b42830dd0c3bd9dcfd9
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "BUSL-1.1", io.loams.ci-service: "true" }
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports: ["19092:19092"]
    # Transactions are on by default (spike §5.1, R0.18); CN2 Task 9's suites
    # wait for a healthy cluster.
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 10s
      retries: 30

  # The Kafka endpoint is on 9092 (SASL_PLAINTEXT, PLAIN, `$ConnectionString`),
  # published on 9092 because the emulator advertises it there (CN2 Task 9);
  # AMQP on 5672, published on 5675. No transactions (R0.19). Its hubs and
  # consumer groups come from emulators/eventhubs.config.json.
  eventhubs:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:2.2.1@sha256:be413f0d59541621879e6d197d73f64f3b3ac5fa45861641fdc1430252b8b44b
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "LicenseRef-Microsoft-Emulator-EULA", io.loams.ci-service: "true" }
    environment:
      ACCEPT_EULA: "Y"
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
    volumes:
      - ./emulators/eventhubs.config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    depends_on: [azurite]
    ports: ["9092:9092", "5675:5672"]

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "LicenseRef-Microsoft-Emulator-EULA", io.loams.ci-service: "true" }
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: Loams-Test-Pass-1
    volumes:
      - ./emulators/servicebus.config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    depends_on: [servicebus-sql]
    ports: ["5676:5672"]

  # The Service Bus emulator's own SQL Server (spike §5.3).
  servicebus-sql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "LicenseRef-Microsoft-SQL-Server-EULA", io.loams.ci-service: "true" }
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Loams-Test-Pass-1

  # SQL Server Developer with the Agent on (CDC tables need it; Task 12).
  # SQL Server 2025: 2022 on Linux refuses TDS 8.0 strict logins
  # (microsoft/mssql-docker#878; CN2 R12.15).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU9-GDR1-ubuntu-24.04@sha256:742481d1b1186cccc81220a1eaacef244ca8d0f7d19c8e5c70df8ae541ffbab2
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "LicenseRef-Microsoft-SQL-Server-EULA", io.loams.ci-service: "true" }
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_SA_PASSWORD: Loams-Test-Pass-1
    # TDS 8.0 strict needs a configured certificate (CN = the host name, EKU
    # serverAuth). A throwaway self-signed one is made inside the container
    # at each start; its key never leaves it.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        d=/var/opt/mssql/tls
        h=$$(hostname)
        mkdir -p "$$d"
        openssl req -x509 -nodes -newkey rsa:2048 -days 30 -subj "/CN=$$h" \
          -addext "subjectAltName=DNS:$$h,DNS:localhost,IP:127.0.0.1" \
          -addext "keyUsage=critical,digitalSignature,keyEncipherment" \
          -addext "extendedKeyUsage=serverAuth" \
          -keyout "$$d/key.pem" -out "$$d/cert.pem" 2>/dev/null
        printf '[network]\ntlscert = %s\ntlskey = %s\n' "$$d/cert.pem" "$$d/key.pem" > /var/opt/mssql/mssql.conf
        exec /opt/mssql/bin/launch_sqlservr.sh /opt/mssql/bin/sqlservr
    ports: ["1433:1433"]
    # Ready once a login answers, so `up --wait` means the suites can connect
    # (the image ships sqlcmd under mssql-tools18; -C trusts its self-signed
    # certificate).
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "Loams-Test-Pass-1", "-Q", "SELECT 1"]
      interval: 3s
      retries: 60

  oracle:
    image: gvenzl/oracle-free:23.26.3-slim@sha256:6d61d267a3b978c24c5ac1790e62e927416a0aec446bd86e4b3a1527562757bd
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "LicenseRef-Oracle-FUTC", io.loams.ci-service: "true" }
    environment:
      ORACLE_PASSWORD: loams-test
      APP_USER: loams
      APP_USER_PASSWORD: loams-test
    ports: ["1521:1521"]

  # Single node: no licence key, no throttling (R0.20).
  cockroachdb:
    image: cockroachdb/cockroach:v26.2.7@sha256:9464ae30465b887295459b98d129a76d074caeaa4c86836d369c6d2fdddd1685
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "LicenseRef-CockroachDB-Software-License", io.loams.ci-service: "true" }
    command: ["start-single-node", "--insecure"]
    ports: ["26257:26257", "8083:8080"]
    # Ready once SQL answers, so `up --wait` means the suites can connect.
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 2s
      retries: 60

  # A one-member replica set: change streams and transactions need one.
  mongodb:
    image: mongo:8.0.30@sha256:4a0f30875898413139bec44c73c02a05fed172578de65b644dcdcee143ae7306
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "SSPL-1.0", io.loams.ci-service: "true" }
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        # Healthy only once the member is the writable primary, so `up --wait`
        # means the suites can write (CN2 Task 16).
        - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }; if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 2s
      retries: 60

  # The same image as a standalone server (no replica set, so no
  # transactions and no change streams): the sink's narrowing to effectively
  # once (CN2 Task 16, mongodb_standalone_narrows_to_effectively_once).
  mongodb-standalone:
    image: mongo:8.0.30@sha256:4a0f30875898413139bec44c73c02a05fed172578de65b644dcdcee143ae7306
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "SSPL-1.0", io.loams.ci-service: "true" }
    command: ["--bind_ip_all"]
    ports: ["27018:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand('ping').ok !== 1) { quit(1) }"]
      interval: 2s
      retries: 60

  redis:
    image: redis:8.10.1@sha256:8a1efc5f479551822b47424ccae982026b633f28818eab0387348120a61e10e2
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "AGPL-3.0-only OR LicenseRef-RSALv2 OR SSPL-1.0", io.loams.ci-service: "true" }
    ports: ["6379:6379"]

  # Elasticsearch 9.5.4 (`ci-service`, OR-3: AGPL-3.0, SSPL or Elastic-2.0, and
  # the image's default binaries are Elastic-2.0), for the native search
  # family (CN2 Task 15). Built 2026-09-09; 9.5.5 is under 14 days old. Single
  # node, security on with Basic auth over plain HTTP, so the `auth` suite runs
  # Basic and API keys.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4@sha256:82ac14f43fe701992e601f4cc81e1c0d7dbc5a2576d8cd736006452925df4026
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "AGPL-3.0-only OR SSPL-1.0 OR Elastic-2.0", io.loams.ci-service: "true" }
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: loams-test-secret
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:loams-test-secret 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 5s
      retries: 60

  splunk:
    image: splunk/splunk:10.4.3@sha256:cc3a3efe2509fa31f67d4aa20dde7118886babf9a0930f197ef996d513c44834
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "LicenseRef-Splunk-General-Terms", io.loams.ci-service: "true" }
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: Loams-Test-Pass-1
      SPLUNK_HEC_TOKEN: 00000000-0000-4000-8000-00000000c0de
    ports: ["8000:8000", "8088:8088", "8089:8089"]

  # The Pub/Sub emulator jar has no licence statement found, so it is
  # treated as a ci-service until verified (R0.27).
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-emulators@sha256:8d8573471c489a409f03891d2c24d177fa531276184f7002b9a2d853d1b3ed54
    profiles: [connectors-ci-only]
    labels: { io.loams.licence: "LicenseRef-Google-Cloud-SDK-Emulator", io.loams.ci-service: "true" }
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085", "--project=loams-test"]
    ports: ["8085:8085"]
