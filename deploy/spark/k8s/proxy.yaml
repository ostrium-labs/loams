apiVersion: v1
kind: ServiceAccount
metadata:
  name: loams-spark-proxy
  labels:
    app.kubernetes.io/name: loams-spark-proxy
    app.kubernetes.io/part-of: loams
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loams-spark-proxy
  labels:
    app.kubernetes.io/name: loams-spark-proxy
    app.kubernetes.io/part-of: loams
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: loams-spark-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loams-spark-proxy
        app.kubernetes.io/part-of: loams
    spec:
      serviceAccountName: loams-spark-proxy
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: proxy
          image: ghcr.io/ostrium-labs/loams-spark-proxy:0.1.2
          args: ["serve", "--config", "/etc/loams-spark-proxy/proxy.toml"]
          ports:
            - { name: connect, containerPort: 15002 }
          env:
            - name: RUST_LOG
              value: info
            - name: OPENFGA_PRESHARED_KEY
              valueFrom:
                secretKeyRef: { name: loams-openfga, key: preshared-key }
          readinessProbe:
            tcpSocket: { port: 15002 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 15002 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/loams-spark-proxy, readOnly: true }
            - { name: keys, mountPath: /etc/loams-spark-proxy/keys, readOnly: true }
      volumes:
        - name: config
          configMap: { name: loams-spark-proxy }
        - name: keys
          secret: { secretName: loams-spark-proxy-keys }
---
# h2c to the gateway / ingress that terminates TLS for
# <instance>.<ns>.<region>.spark.<base-domain>:443. Spark sessions are
# sticky to one backend by routing, not by proxy replica, so any replica
# serves any call.
apiVersion: v1
kind: Service
metadata:
  name: loams-spark-proxy
  labels:
    app.kubernetes.io/name: loams-spark-proxy
spec:
  selector:
    app.kubernetes.io/name: loams-spark-proxy
  ports:
    - { name: connect, port: 15002, targetPort: 15002, appProtocol: kubernetes.io/h2c }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loams-spark-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loams-spark-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loams-gateway
          namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 15002 }
