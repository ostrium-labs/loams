broker_endpoint='http://storage_broker:50051'
pg_distrib_dir='/usr/local/'
listen_pg_addr='0.0.0.0:6400'
listen_http_addr='0.0.0.0:9898'
# control_plane_api and its token are added at start (compose.yaml): pg-control's upcall
# listener with the postgres-control profile, else a junk address (no storage controller).
control_plane_emergency_mode=true
virtual_file_io_mode="buffered" # the CI runners where we run the docker compose tests have slow disks
