# The Loams `browser` service on Kubernetes (D2114, preview).
#
#   kubectl -n loams create secret generic loams-browser-token \
#     --from-literal=token="$(openssl rand -hex 32)"
#   kubectl apply -k deploy/browser/k8s -n loams
#
# agentd (and loams-gateway, once it routes CDP) read the same secret and set
# LOAMS_BROWSER_PROVIDER=service with
# LOAMS_BROWSER_SERVICE_URL=ws://loams-browser:9222/devtools/browser.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: loams
    includeSelectors: false
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
