# The Loams `browser` service on Kubernetes (D2114, preview).
#
#   kubectl -n loams create secret generic loams-browser-token \
#     --from-literal=token="$(openssl rand -hex 32)"
#   kubectl -n loams create secret generic loams-browser-clients \
#     --from-literal=clients="$(printf %s "$CLIENT_TOKEN" | sha256sum | cut -d' ' -f1)"
#   kubectl apply -k deploy/browser/k8s -n loams
#
# agentd goes through loams-browser-gateway (D2118) with CLIENT_TOKEN:
# LOAMS_BROWSER_PROVIDER=service,
# LOAMS_BROWSER_SERVICE_URL=ws://loams-browser-gateway:9223/devtools/browser.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: loams
    includeSelectors: false
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - gateway.yaml
images:
  # The first loams-gateway release with the browser module (D2118). Until it
  # is published, build deploy/release/Containerfile.loams-gateway and set
  # newName/newTag to your image.
  - name: ghcr.io/ostrium-labs/loams-gateway
    newTag: "0.1.3"
