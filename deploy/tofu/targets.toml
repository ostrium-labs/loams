# Deploy targets for `loams deploy` (design 86, plan OP2-C). Embedded by crates/loams-deploy.
#
# One [targets.<kind>] table each. Fields:
#   module          directory under deploy/tofu/modules/ (empty when there is none)
#   cloud           aws | gcp | azure | server | none
#   class           k3s | managed-k8s | server | compose | app-free | laptop
#   operator        deployed by `loams deploy` with the operator (needs deploy/tofu/examples/<kind>)
#   available       the module (and example root) exist in the tree; a module task flips its own target
#   sizes.*         one NODE of the size and how many nodes: cpu_millis, memory_mib, nodes
#   reserve         what the platform base plus the Access database take (an estimate)
#   disk_sku, egress_sku   price table SKUs (deploy/tofu/prices.toml)
#   keep_on_destroy state addresses removed from state and kept on teardown (the real addresses in the example root, module "target")
#   credentials     the CLI session the user needs: aws | gcloud | az | ssh
#   needs_tailnet   the engine is reached over the user's tailnet

# Operator targets: their modules are created by later tasks, which flip `available`.
[targets.aws-k3s]
module = "aws-k3s"
cloud = "aws"
class = "k3s"
operator = true
available = true
free_tier = false
default_region = "us-east-1"
disk_sku = "aws/ebs/gp3"
egress_sku = "aws/network/egress-internet"
required_inputs = []
# the bucket, its key and the settings that keep it private, versioned and encrypted once kept
keep_on_destroy = [
  "module.target.aws_s3_bucket.this",
  "module.target.aws_s3_bucket_ownership_controls.this",
  "module.target.aws_s3_bucket_public_access_block.this",
  "module.target.aws_s3_bucket_versioning.this",
  "module.target.aws_s3_bucket_server_side_encryption_configuration.this",
  "module.target.aws_s3_bucket_lifecycle_configuration.this",
  "module.target.aws_s3_bucket_policy.this",
  "module.target.aws_kms_key.bucket",
]
credentials = "aws"
needs_tailnet = true
reserve = { cpu_millis = 1500, memory_mib = 4096 }
sizes.small = { cpu_millis = 2000, memory_mib = 8192, nodes = 1 }
sizes.medium = { cpu_millis = 4000, memory_mib = 16384, nodes = 1 }

[targets.gcp-k3s]
module = "gcp-k3s"
cloud = "gcp"
class = "k3s"
operator = true
available = true
free_tier = false
default_region = "us-central1"
disk_sku = "gcp/pd/balanced"
egress_sku = "gcp/network/egress-internet"
required_inputs = ["project"]
# the bucket, its key and the settings that keep it private, versioned and encrypted once kept
# (the key ring and the key's IAM binding for the storage agent stay in state with the key; Cloud KMS keys cannot be deleted)
keep_on_destroy = [
  "module.target.google_storage_bucket.this",
  "module.target.google_kms_key_ring.bucket",
  "module.target.google_kms_crypto_key.bucket",
  "module.target.google_kms_crypto_key_iam_member.gcs_agent",
]
credentials = "gcloud"
needs_tailnet = true
reserve = { cpu_millis = 1500, memory_mib = 4096 }
sizes.small = { cpu_millis = 2000, memory_mib = 8192, nodes = 1 }
sizes.medium = { cpu_millis = 4000, memory_mib = 16384, nodes = 1 }

[targets.azure-k3s]
module = "azure-k3s"
cloud = "azure"
class = "k3s"
operator = true
available = false
free_tier = false
default_region = "eastus"
disk_sku = "azure/disk/premium-ssd-p6"
egress_sku = "azure/network/egress-internet"
required_inputs = ["subscription_id"]
keep_on_destroy = ["module.target.azurerm_storage_account.this", "module.target.azurerm_storage_container.this", "module.target.azurerm_key_vault_key.storage"]
credentials = "az"
needs_tailnet = true
reserve = { cpu_millis = 1500, memory_mib = 4096 }
sizes.small = { cpu_millis = 2000, memory_mib = 8192, nodes = 1 }
sizes.medium = { cpu_millis = 4000, memory_mib = 16384, nodes = 1 }

