# Dated cloud list prices for the deploy cost estimate (design 86, plan OP2-C D2615, D2370).
# Embedded by crates/loams-deploy. SKU = <cloud>/<service>/<name>.
#
# Prices are public list prices, pay-as-you-go, for us-east-1, us-central1 and eastus, read
# from each entry's pricing page. `verified = false` until a billed amount confirms the
# entry (bench/cloud/ledger.py). `source = "estimate"` where the page gives no direct
# per-unit price. `usd` is a decimal string. Units: hour, gib-month, gib, month (month =
# one resource, for example one key or one managed disk). `free.quantity` is per month in
# the entry's unit.
# Azure Key Vault: a software-protected key has no per-key fee (operations are $0.03 per
# 10,000, negligible here), so the entry is an estimate of 0. Azure disks are per disk
# (P6 = 64 GiB, P10 = 128 GiB, P3 = 16 GiB). The VM entries match the `*-vm` modules'
# hourly estimates of 2026-10-21. GCP egress is the Premium Tier 0-1 TiB internet rate.

read = 2026-11-02

