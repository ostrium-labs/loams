# The Go stubs for module `loams.dev/go` (design §44 §9 row 3, §10.1 points 2
# and 3): two remote plugins, both pinned to an exact version.
#
# Unlike Python's, this output **is committed**: Go's module proxy and
# `pkg.go.dev` build from a tag, and the mirror repository
# `ostrium-labs/loams-go` is a subtree of `sdks/go/`, so a consumer that vendors
# the module needs the generated code in the repository (§44 §10.1 point 3:
# "Go and PHP mirrors must carry generated code in the repo").
# `scripts/sdk/drift.sh` regenerates and fails on a diff here.
#
# `managed` sets `go_package` for every file to one prefix, which is what makes
# `paths=source_relative` land the files where their import paths say they are:
# `sdks/go/gen/loams/<package path>/v1/*.pb.go` for
# `loams.dev/go/gen/loams/<package path>/v1`. The well-known types keep their
# own import paths; buf's managed mode does not touch them.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: loams.dev/go/gen
inputs:
  - directory: proto
    paths:
      - proto/loams/options/v1
      - proto/loams/errors/v1
      - proto/loams/instance/v1
      - proto/loams/devices/v1
      - proto/loams/approvals/v1
      - proto/loams/operations/v1
      - proto/loams/notifications/v1
      - proto/loams/live/v1
plugins:
  # `protoc-gen-go`: the messages and service descriptors (Go package `v1`).
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: sdks/go/gen
    opt:
      - paths=source_relative
  # `protoc-gen-connect-go`: the Connect clients and handlers, which
  # protoc-gen-connect-go writes into a `v1connect` sub-package beside the
  # messages. connectrpc/connect-go v1.21.0, Apache-2.0. v1 is the stable line;
  # v2 is at release candidate and is not pinned (see the ruling in
  # docs/plans/2026-10-02-sdk1-generation-pipeline.md).
  - remote: buf.build/connectrpc/go:v1.21.0
    out: sdks/go/gen
    opt:
      - paths=source_relative
clean: true