name: Desktop promote

# Copies the signed update manifests of a PUBLISHED release onto the rolling `desktop-latest` release,
# which is what LOAMS_UPDATE_FEED points at
# (https://github.com/<owner>/<repo>/releases/download/desktop-latest). Clients are never pointed at a
# draft or a pre-release: the release must be published, and a pre-release is skipped.
#
# Two kinds of source release:
#   desktop-vX.Y.Z  runs when the release is published (docs/release/desktop.md).
#   vX.Y.Z          the product release. It is published before the desktop files are attached, so
#                   desktop-electron-release.yml calls this workflow at the end of its run instead.
# Either can be dispatched by hand with the tag; `dry_run` stages and verifies the feed without
# uploading anything.
#
# The manifests name their payload files relatively (`url: loams-desktop-1.2.3-win-x64.exe`), so the
# files they reference are copied too, and assets of earlier versions are removed afterwards. Every
# manifest must carry a `.sig` that verifies against the pinned key (apps/desktop-electron/
# update-pubkey.txt), and every payload must match the sha512 and size its manifest lists
# (apps/desktop-electron/scripts/update-feed.mjs). A release without manifests (built while the
# update key was unset) is a clean no-op.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to promote: desktop-vX.Y.Z or a product vX.Y.Z.'
        required: true
      allow_downgrade:
        description: 'Promote even if this version is not newer than the one in desktop-latest.'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Download, verify and stage the feed; upload nothing.'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  promote:
    name: Promote to desktop-latest
    # A product release's `published` event fires before its desktop files exist; the release
    # workflow calls this one for it instead (workflow_call carries the caller's event name).
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'desktop-v')
    # Same protected environment as the release: a reviewer approves what clients are offered.
    environment: desktop-release
    concurrency:
      group: desktop-promote
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      FEED_TAG: desktop-latest
      ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade == true }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/desktop-electron/scripts/update-feed.mjs
            apps/desktop-electron/update-pubkey.txt
          sparse-checkout-cone-mode: false
      - name: the release is published and carries manifests
        id: check
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^(desktop-)?v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is not a desktop-vX.Y.Z or vX.Y.Z tag"; exit 1; }
          skip() { echo "::notice::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ -z "$(node apps/desktop-electron/scripts/update-feed.mjs pinned)" ]; then
            skip "apps/desktop-electron/update-pubkey.txt is empty: the in-app updater is off, nothing to promote"
          fi
          read -r draft pre < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -q '"\(.isDraft) \(.isPrerelease)"')
          [ "$draft" = false ] || { echo "::error::$TAG is still a draft; publish it first (clients are never pointed at a draft)"; exit 1; }
          [ "$pre" = false ] || skip "$TAG is a prerelease; the feed follows published, non-prerelease releases only"
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          grep -qE '^latest.*\.yml$' <<<"$names" \
            || skip "$TAG has no latest*.yml (built without LOAMS_UPDATE_SIGNING_KEY); nothing to promote"
      - name: not older than what clients are offered now
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          new="${TAG#desktop-}"; new="${new#v}"
          # Fail closed: only a feed release that does not exist yet (HTTP 404) or that has no
          # manifest counts as "nothing served". Any other error stops the promotion.
          if ! rel=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$FEED_TAG" 2>&1); then
            if grep -q 'HTTP 404' <<<"$rel"; then echo "desktop-latest does not exist yet; promoting $new"; exit 0; fi
            echo "::error::cannot read $FEED_TAG: $rel"; exit 1
          fi
          manifests=$(jq -r '.assets[].name | select(test("^latest.*\\.yml$"))' <<<"$rel")
          if [ -z "$manifests" ]; then echo "desktop-latest has no manifest yet; promoting $new"; exit 0; fi
          cur=""
          for m in $manifests; do
            # set -e: a failed download fails the job instead of reading as "no version".
            yml=$(gh release download "$FEED_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$m" --output -)
            v=$(sed -nE 's/^version:[[:space:]]*["'"'"']?([^"'"'"'[:space:]#]+).*/\1/p' <<<"$yml" | head -1)
            [ -n "$v" ] || { echo "::error::$m in $FEED_TAG has no readable version"; exit 1; }
            cur=$(printf '%s\n%s\n' "$cur" "$v" | sed '/^$/d' | sort -V | tail -1)
          done
          newest=$(printf '%s\n%s\n' "$cur" "$new" | sort -V | tail -1)
          if [ "$new" = "$cur" ] || [ "$newest" != "$new" ]; then
            if [ "$ALLOW_DOWNGRADE" = true ]; then
              echo "::warning::promoting $new over $cur (allow_downgrade)"
            else
              echo "::error::$new is not newer than $cur, which desktop-latest serves now. Dispatch with allow_downgrade to force it."
              exit 1
            fi
          fi
      - name: download, verify and stage the feed
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/src"; out="$RUNNER_TEMP/feed"; mkdir -p "$src"
          feed() { node apps/desktop-electron/scripts/update-feed.mjs "$@"; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$src" --pattern 'latest*.yml' --pattern 'latest*.yml.sig'
          for f in $(feed payloads "$src"); do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$src" --pattern "$f"
          done
          # Signatures against the pinned key, payload sha512 and size, one version: or nothing.
          feed stage "$src" "$out"
          ls -l "$out"
      - name: publish the feed
        if: steps.check.outputs.skip != 'true' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/feed"
          if ! gh release view "$FEED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # prerelease keeps the rolling feed out of GitHub's "latest release"
            gh release create "$FEED_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --title "Desktop update feed" \
              --notes "Rolling update feed for Loams Desktop. Managed by desktop-promote.yml; do not edit by hand." \
              --target "$GITHUB_SHA"
          fi
          # Order matters: payloads, then signatures, then manifests last, so a client that sees a
          # manifest always finds its payload and signature.
          payloads=(); sigs=(); manifests=()
          for f in "$d"/*; do
            case "$(basename "$f")" in
              latest*.yml.sig) sigs+=("$f") ;;
              latest*.yml) manifests+=("$f") ;;
              *) payloads+=("$f") ;;
            esac
          done
          [ ${#payloads[@]} -eq 0 ] || gh release upload "$FEED_TAG" "${payloads[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$FEED_TAG" "${sigs[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$FEED_TAG" "${manifests[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          # drop assets left over from earlier versions
          keep=$(cd "$d" && ls)
          for a in $(gh release view "$FEED_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            grep -qxF "$a" <<<"$keep" || gh release delete-asset "$FEED_TAG" "$a" --yes --repo "$GITHUB_REPOSITORY"
          done
          echo "desktop-latest now serves $TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: dry run summary
        if: steps.check.outputs.skip != 'true' && env.DRY_RUN == 'true'
        run: |
          { echo "Dry run: desktop-latest would serve $TAG with:"; echo; ls -1 "$RUNNER_TEMP/feed" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
