name: Temporal SDK leg (Ruby)

# TSDK-ruby (D2150-D2154): the Ruby SDK (the temporalio gem on sdk-core, at
# conformance/compute/pins.env's TEMPORAL_SDK_RUBY) beside the Go and
# TypeScript legs of temporal-gateway.yml, one workflow per extra SDK so the
# SDK lanes do not edit the same file.
#
#   unit       bundler + minitest on the corpus's Ruby worker (no server)
#   upstream   the Ruby corpus against upstream Temporal (`temporal server
#              start-dev`, the corpus's fallback oracle until compat mode is
#              go), replayed by the gem's WorkflowReplayer; uploaded as an
#              artifact, from which histories/ruby/ is committed
#   gateway    the Ruby leg through the compose profile `temporal-gateway`
#              (run.sh --profile with SDK_LEGS=ruby): the scenarios through
#              loams-temporal, the replayer on the gateway's histories, and
#              compare.py against the committed Ruby corpus and against this
#              run's upstream one
#
# On pull requests that touch the gateway or the Ruby leg, and by hand. Not
# part of `CI required`, like temporal-gateway.yml.
#
# Do not event-filter paths: the filter job decides, as in ci.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-sdk-ruby-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      ruby: ${{ steps.filter.outputs.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # dorny/paths-filter is MIT-licensed; pinned to v4.0.3, as in ci.yml.
      # Empty token forces local Git comparison, including fork PRs; no PR API permission.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          token: ''
          base: ${{ github.event.pull_request.base.sha }}
          ref: ${{ github.event.pull_request.head.sha }}
          filters: |
            ruby:
              - 'conformance/compute/temporal/corpus/workers/ruby/**'
              - 'conformance/compute/temporal/corpus/generate-ruby.sh'
              - 'conformance/compute/temporal/corpus/scenarios.json'
              - 'conformance/compute/temporal/gateway/legs/ruby.sh'
              - 'conformance/compute/pins.env'
              - '.github/workflows/temporal-sdk-ruby.yml'
            gateway:
              - 'crates/loams-temporal-*/**'
              - 'crates/loams-gateway/src/temporal/**'
              - 'conformance/compute/temporal/**'
              - 'conformance/compute/temporal-gateway.yaml'
              - 'conformance/compute/lib.sh'
              - 'conformance/compute/pins.env'
              - 'deploy/release/compute/durable-init.sh'
              - 'deploy/release/compose.compute.yaml'
              - 'deploy/release/Containerfile.loams-temporal'
              - 'deploy/release/temporal-gateway.toml.example'
              - '.github/workflows/temporal-sdk-ruby.yml'

  unit:
    name: "Temporal SDK Ruby: corpus worker unit tests (bundler)"
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bundle install and minitest in the pinned Ruby image
        run: |
          . conformance/compute/lib.sh
          docker run --rm -v "$PWD/conformance/compute/temporal/corpus:/c:ro" \
            -e BUNDLE_FROZEN=true -e "BUNDLER_VERSION=$BUNDLER_VERSION" "$RUBY_IMAGE" \
            sh -ec "cp -r /c /tmp/corpus && cd /tmp/corpus/workers/ruby && \
              gem install --no-document bundler -v $BUNDLER_VERSION >/dev/null && \
              bundle install --quiet && \
              for f in generate.rb replay.rb lib/*.rb test/*.rb; do ruby -c \$f >/dev/null; done && \
              bundle exec ruby test/scenarios_test.rb"

  upstream:
    name: "Temporal SDK Ruby: corpus against upstream Temporal (start-dev)"
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ruby == 'true' || needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OC_OUT: ${{ github.workspace }}/target/compute
      OC_NETWORK: tsdk-ruby-corpus-net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: start-dev on a network of its own
        run: |
          . conformance/compute/lib.sh
          docker network create "$OC_NETWORK"
          docker run -d --name tsdk-ruby-temporal --network "$OC_NETWORK" --network-alias temporal-frontend \
            "$TEMPORAL_ADMIN_TOOLS_IMAGE" temporal server start-dev --ip 0.0.0.0 --headless
          for _ in $(seq 60); do
            docker run --rm --network "$OC_NETWORK" "$TEMPORAL_ADMIN_TOOLS_IMAGE" \
              temporal operator cluster health --address temporal-frontend:7233 >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs tsdk-ruby-temporal | tail -50
          exit 1
      - name: generate-ruby.sh (generate, export, replay)
        run: |
          mkdir -p "$OC_OUT/ruby-upstream"
          CORPUS_SERVER=start-dev conformance/compute/temporal/corpus/generate-ruby.sh --out "$OC_OUT/ruby-upstream" \
            2>&1 | tee "$OC_OUT/ruby-upstream/generate.log"
      - name: the server's logs
        if: failure() || cancelled()
        run: docker logs tsdk-ruby-temporal >"$OC_OUT/ruby-upstream/server.log" 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: temporal-sdk-ruby-upstream-corpus
          path: target/compute/ruby-upstream
          if-no-files-found: ignore
          retention-days: 14

  gateway:
    name: "Temporal gateway: Ruby SDK leg (temporal-gateway profile)"
    needs: [changes, upstream]
    # Runs even when the upstream generation failed: the gateway half still says something.
    if: >-
      always() && needs.changes.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.ruby == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OC_OUT: ${{ github.workspace }}/target/compute
      DOCKER_BUILDKIT: '1'
      LEG_TIMEOUT: '900'
      SDK_LEGS: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the Ruby leg through the temporal-gateway profile
        run: conformance/compute/temporal/gateway/run.sh --profile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always() && needs.upstream.result == 'success'
        with:
          name: temporal-sdk-ruby-upstream-corpus
          path: target/compute/ruby-upstream
      - name: the gateway's Ruby histories against this run's upstream ones
        if: always() && needs.upstream.result == 'success'
        run: |
          . conformance/compute/lib.sh
          scenarios=$(python3 -c 'import json,sys; print(",".join(s["name"] for s in json.load(open(sys.argv[1]))["scenarios"] if s["phase"]=="DX1"))' conformance/compute/temporal/corpus/scenarios.json)
          mkdir -p target/compute/ruby-oracle
          ln -sfn "$OC_OUT/ruby-upstream/ruby" target/compute/ruby-oracle/ruby
          python3 -I conformance/compute/temporal/gateway/compare.py --corpus target/compute/ruby-oracle \
            --gateway "$OC_OUT/temporal-gateway-profile/histories" --scenarios "$scenarios" --langs ruby \
            --junit "$OC_OUT/temporal-gateway-profile/ruby-vs-upstream.junit.xml"
          oc_xfail_check temporal/gateway "$OC_OUT/temporal-gateway-profile/ruby-vs-upstream.junit.xml"
      - name: the stack's logs
        if: failure() || cancelled()
        run: |
          . conformance/compute/lib.sh
          oc_compose --gateway --profile temporal-gateway ps -a || true
          oc_compose --gateway --profile temporal-gateway logs --no-color --tail 500 temporal-gateway loams compute-init compute1 >"$OC_OUT/temporal-gateway-profile/stack.log" 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: temporal-sdk-ruby-gateway-leg
          path: target/compute/temporal-gateway-profile
          if-no-files-found: ignore
          retention-days: 14
