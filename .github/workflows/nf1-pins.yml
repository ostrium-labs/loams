# NF1 (docs/plans/2026-10-09-nf1-neon-fork.md): Loams Postgres's names and pins.
#
# names (Task 1b, D823): no pre-rename name is left (the crate loams-neon, the
# dev stack deploy/neon, the fork's old URL ostrium-labs/neon). Task 2 adds
# `pins.py check`; Task 12 adds `verify`.
name: NF1 pins

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nf1-pins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  names:
    name: no pre-rename names (check-names.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check-names.sh and its tests
        run: scripts/nf1/tests/test_check_names.sh
