# The hosted-deploy checks imported from the former private
# ostrium-labs/loams-platform repository on 2026-10-19 (docs/platform/README.md).
# The `platform/` Cargo workspace and its `platform-rust` job are gone: the node
# agent moved to crates/loams-meter-agent in the root workspace, which ci.yml
# builds and tests (design 63 D1135, plan ME1 Task 0b).
#
#   tailnet-lint      offline HuJSON/subset check of deploy/tailnet's policy
#   tailnet-headscale Headscale's own `policy check` against a throwaway
#                     database (pinned image), so the shared policy stays valid
#                     for both providers
#
# The private repository's `tailscale` job (test and apply the policy through
# the Tailscale API with TS_OAUTH_* secrets) is not carried over: by the
# owner's ruling of 2026-10-19 it runs from a separate private deployment
# repository, never from this public one (docs/platform/deploy/tailnet.md,
# step 3).
name: Platform

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "deploy/tailnet/**"
      - ".github/workflows/platform.yml"
  pull_request:
    paths:
      - "deploy/tailnet/**"
      - ".github/workflows/platform.yml"

# A newer push to a pull request supersedes the older run; dev runs to
# completion.
concurrency:
  group: platform-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tailnet-lint:
    name: "Platform: tailnet policy lint"
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 deploy/tailnet/policy/lint.py

  tailnet-headscale:
    name: "Platform: tailnet policy, Headscale check"
    runs-on: ${{ (vars.CI_RUNNER == 'local' && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER')))) && fromJSON('["self-hosted","loams-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: deploy/tailnet/headscale/policy/check.sh
