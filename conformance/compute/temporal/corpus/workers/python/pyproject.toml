# The Python half of the Temporal history corpus (DX0 Task 4 shape; lane
# TSDK-python, D2135): workflows, activities, a worker and a starter per
# scenario (generate), and the SDK's Replayer (replay). Not a package: run
# with `uv run python -m corpus_py ...` from this directory.
[project]
name = "loams-temporal-corpus-py"
version = "0.0.0"
description = "The Python half of the Loams Temporal history corpus (generator, worker, starter and replayer)."
license = "Apache-2.0"
requires-python = ">=3.12"
# temporalio 1.34.0 (MIT, 2026-09-30): the newest release at least 14 days
# old on 2026-10-27 (D2136). pins.env's TEMPORAL_SDK_PY must match.
dependencies = ["temporalio==1.34.0"]

[tool.uv]
package = false
