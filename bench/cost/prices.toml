# --- Confluent Cloud (lane CFB, docs/benchmarks/confluent-cloud-2026-10.md) -
[confluent]
# Confluent publishes no Dedicated CKU price ("contact sales"). The lane's
# guard counted $4.00/CKU-hour; third-party list estimates are $3.00-3.30.
cku_usd_per_hour = 4.00
cku_label = "assumption"
cku_source = "bench/confluent guard rule; Confluent publishes no CKU price (docs/benchmarks/confluent-cloud-2026-10.md, Spend)"
cku_usd_per_hour_low = 3.00
cku_low_source = "third-party list estimates of $3.00-3.30 quoted in the CFB ledger"
data_in_usd_per_gb = 0.05
data_label = "published"
data_source = "confluent.io/confluent-cloud/pricing, read 2026-10-26 and 2026-10-28 (CFB ledger, Prices used)"
# Measured spend (the guard's binding upper bound, before the Costs API
# reconciliation due by 2026-10-31/11-01) and the ingress it paid for.
spend_upper_usd = 1211.05
spend_label = "measured (upper bound)"
spend_source = ".he0-shared/confluent-bench-ledger.md, phase 3 STOP 2026-10-29T00:58Z"
ingress_gb = 3177
ingress_source = "same ledger: data $158.87 = 3,177 GB in (Metrics API)"
dedicated_test_usd = 542.36
dedicated_test_gb = 1303
dedicated_test_source = "bench/confluent/results/2026-10-28/cost.json (Dedicated x4 per-test recount)"
# Result files the throughput is computed from.
dedicated_cluster = "bench/confluent/results/2026-10-28/dedicated/loams-cfb-aws-d4"
dedicated_cku = 4
burst_series = "bench/confluent/results/2026-10-28/burst/cal96-loams-cfb-aws-x2-series.json"
burst_cku = 4
burst_payload_bytes = 10

# --- Iggy native on our hardware ------------------------------------------
[iggy]
# bench/all/native/iggy.sh: iggy-bench balanced producer, 100-byte messages.
message_bytes = 100
message_source = "bench/all/native/iggy.sh (size=100)"
# One server, one shard, no replication, the build's default persistence.
# For a like-for-like with a replicated Kafka service we also show the
# server cost times this factor (an assumption: each replica costs a full
# server's CPU, network not counted).
replication_factor = 3
replication_label = "assumption"
