# Prices for bench/cost/compute.py.
#
# Every value says where it came from (`source`) and what kind of number it
# is (`label`):
#   published   read from a vendor's or agency's published price list
#   measured    taken from our own bill, ledger or results
#   assumption  chosen by us; the sensitivity table varies it
#
# Change a value here and rerun `python3 bench/cost/compute.py --update`
# to regenerate every table in docs/benchmarks/2026-10-29-cost-per-op/.

# How many cloud vCPUs one busy laptop core is worth. The laptop (Intel Core
# Ultra 5 225H) has no SMT: a "core" is one physical core. A c7i vCPU is one
# hyperthread of a Sapphire Rapids core. 1 is the optimistic mapping; the
# sensitivity table also shows 2 (one whole physical core per laptop core).
[mapping]
vcpu_per_core = 1
vcpu_per_core_sensitivity = [1, 2]
label = "assumption"

# --- Reference price 1: on-demand cloud vCPU ------------------------------
[price.on_demand]
name = "AWS EC2 c7i.large on-demand"
kind = "cloud"
usd_per_hour = 0.08925
vcpus = 2
region = "us-east-1, Linux, shared tenancy"
label = "published"
source = "AWS Price List (pricing calculator feed ec2-ondemand-without-sec-sel, US East (N. Virginia), Linux), publication 2026-10-28T18:03:52Z; https://aws.amazon.com/ec2/pricing/on-demand/"
retrieved = "2026-10-29"

# --- Reference price 2: 3-year commitment ---------------------------------
[price.reserved_3y]
name = "AWS EC2 Instance Savings Plan, c7i, 3 years, no upfront"
kind = "cloud"
usd_per_hour = 0.03929
vcpus = 2
region = "us-east-1, Linux, c7i.large effective rate"
label = "published"
source = "AWS Price List API, AWSComputeSavingsPlan us-east-1 offer file, publication 2026-10-28T18:02:49Z, rate code D2YVZHPR4MTDUCJY.4TFFGXJMCK23ZSWR; https://aws.amazon.com/savingsplans/compute-pricing/"
retrieved = "2026-10-29"

# --- Reference price 3: owned hardware, 3-year straight-line + power -----
# The same CPU as the benchmark laptop, in a mini-PC barebone, so the
# measured per-core throughput applies without a CPU-to-CPU conversion.
[price.owned]
name = "Owned: Gigabyte BRIX GB-BRU5-225H (Core Ultra 5 225H), 3 years + power"
kind = "owned"
hardware_usd = 612.93
hardware_label = "published"
hardware_source = "AVADirect product 19197029, GIGABYTE BRIX GB-BRU5-225H barebone, $612.93; https://www.avadirect.com/BRIX-GB-BRU5-225H-Intel-Core-Ultra-5-225H-2x-DDR5-CSO-DIMM-2x-M-2-NVMe-SSD-Intel-Arc-GPU-Mini-PC-Barebone/Product/19197029"
hardware_retrieved = "2026-10-29"
# The barebone has no RAM or SSD. 16 GB DDR5 SO-DIMM + 1 TB NVMe; DRAM
# prices moved a lot in 2026, so this is a round assumption, not a quote.
extra_usd = 250.0
extra_label = "assumption"
cores = 14
years = 3
# Whole-system draw. 100 W is the barebone's power-supply rating (20 V, 5 A),
# an upper bound; the CPU's base power is 28 W and its maximum turbo power
# 115 W (package only, short bursts).
watts = 100.0
watts_label = "published (PSU rating, used as an upper bound)"
watts_source = "AVADirect product page above: DC 20V/5A, 100W; CPU 28 W base / 115 W max turbo per https://www.notebookcheck.net/Intel-Core-Ultra-5-225H-Processor-Benchmarks-and-Specs.944682.0.html"
watts_low = 28.0
usd_per_kwh = 0.1447
kwh_label = "published"
kwh_source = "US EIA, Electric Power Monthly table 5.6.A, commercial sector, August 2026 (preliminary), 14.47 cents/kWh; https://www.eia.gov/electricity/monthly/epm_table_grapher.php?t=epmt_5_6_a"
kwh_retrieved = "2026-10-29"
# Not included: rack space, cooling overhead (PUE), network, spares, people.
label = "published + assumption"

