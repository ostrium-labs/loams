[package]
name = "gateway-bench"
description = "BQ1-gw: load generators and stand-ins for measuring loams-gateway (HTTP route QPS, TLS handshakes/s, the browser proxy route, auth cost, connections per GB)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "gw-bench"
path = "src/main.rs"

[dependencies]
clap.workspace = true
loams-gateway = { path = "../../crates/loams-gateway" }
# The same TLS stack and certificate generator as loams-gateway.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
serde_json.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[lints]
workspace = true
